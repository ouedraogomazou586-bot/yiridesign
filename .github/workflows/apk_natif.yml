# Fabrique l'application YiriDesign en APK « natif » (comme Mortier) : tout est dans l'APK, rien ne dépend de Chrome.
# Lancement : onglet Actions -> « Fabriquer YiriDesign (APK natif) » -> Run workflow.
name: Fabriquer YiriDesign (APK natif)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Vérifier les fichiers de l'application
        run: |
          test -f index.html || { echo "ERREUR : index.html est introuvable à la racine du dépôt."; exit 1; }
          test -d assets/fonds || { echo "ERREUR : le dossier assets est absent. Lance d'abord « Installer la bibliothèque d'images »."; exit 1; }
          ls -la
          du -sh assets

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Garder la même clé de signature d'une fabrication à l'autre
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yiridesign-debug-keystore-v1

      - name: Créer le projet Android
        run: |
          mkdir -p /tmp/natif/www
          cp index.html /tmp/natif/www/
          cp -r assets /tmp/natif/www/assets
          for f in manifest.webmanifest ic192.png ic512.png; do [ -f "$f" ] && cp "$f" /tmp/natif/www/ || true; done
          cd /tmp/natif
          cat > package.json <<'JSON'
          {"name":"yiridesign","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/app":"^6.0.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0","@capacitor/filesystem":"^6.0.0","@capacitor/share":"^6.0.0"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"bf.yiridesign.app","appName":"YiriDesign","webDir":"www","server":{"androidScheme":"https"},"backgroundColor":"#0F766E"}
          JSON
          npm install --no-audit --no-fund
          # Scanner de documents Google (ML Kit) : si le plugin est introuvable, l'APK est fabriqué quand même (l'ancien scanner prend le relais)
          npm install @capacitor-mlkit/document-scanner@^6 --no-audit --no-fund || echo "ATTENTION : plugin scanner Google non installé, l'ancien scanner sera utilisé"
          npx cap add android
          npx cap sync android
          echo "Fichiers embarqués dans l'APK :"
          find android/app/src/main/assets/public -type f | wc -l
          du -sh android/app/src/main/assets/public

      - name: Régler Android (icône, orientation, écran de démarrage, version)
        run: |
          cd /tmp/natif
          cat > /tmp/regler.py <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          assert "<activity" in s, "manifeste inattendu : balise activity introuvable"
          if "screenOrientation" not in s:
              s = s.replace("<activity", '<activity android:screenOrientation="portrait"', 1)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY
          python3 /tmp/regler.py
          pip install --quiet pillow
          cat > /tmp/icones.py <<'PY'
          import os, shutil
          from PIL import Image
          src = None
          for n in ("ic512.png", "ic192.png"):
              if os.path.exists("www/" + n):
                  src = Image.open("www/" + n).convert("RGBA"); break
          if src is None:
              print("pas d'icône : icône par défaut"); raise SystemExit
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          for d, px in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              folder = res + "/mipmap-" + d
              os.makedirs(folder, exist_ok=True)
              im = src.resize((px, px), Image.LANCZOS)
              for nom in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  im.save(folder + "/" + nom)
          PY
          python3 /tmp/icones.py
          # écran de démarrage : fond vert YiriDesign à la place du logo Capacitor
          find android/app/src/main/res -name 'splash*.png' -delete || true
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><color android:color="#0F766E"/></item>
              <item android:gravity="center" android:width="120dp" android:height="120dp"><bitmap android:src="@mipmap/ic_launcher" android:gravity="center"/></item>
          </layer-list>
          XML
          # numéro de version = numéro de fabrication (permet les mises à jour)
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName\|applicationId" android/app/build.gradle

      - name: Compiler l'APK
        working-directory: /tmp/natif/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer le fichier
        run: |
          cp /tmp/natif/android/app/build/outputs/apk/debug/app-debug.apk "YiriDesign-${{ github.run_number }}.apk"
          ls -la YiriDesign-*.apk

      - name: Publier l'APK (page « Releases » du dépôt)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: YiriDesign ${{ github.run_number }}
          body: Application Android YiriDesign, fabrication numéro ${{ github.run_number }}. Télécharge le fichier .apk ci-dessous puis installe-le.
          files: YiriDesign-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YiriDesign-apk
          path: YiriDesign-${{ github.run_number }}.apk
