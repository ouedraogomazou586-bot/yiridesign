<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#0f766e;--ac2:#115e59;--bd:#e3e1db}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:calc(16px*var(--ts,1))}

header h1{font-size:18px;margin:0;font-weight:700;flex:1}
html[data-theme=dark] header{background:#0b3f3b}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;min-height:44px;min-width:44px}
html[data-theme=dark] .danger{color:#fca5a5!important;border-color:#fca5a5!important}.danger{color:#b91c1c;border-color:#b91c1c}
html[data-theme=dark] .btn:not(.sec),html[data-theme=dark] .tabs button.on,html[data-theme=dark] .seg button.on{background:var(--ac2);border-color:var(--ac2)}
main{padding:16px;max-width:760px;margin:0 auto;padding-bottom:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ban{position:relative;overflow:hidden;border-radius:18px;height:178px;margin:0 0 10px;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#222}
.bt{display:flex;height:100%;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.bs{flex:0 0 100%;box-sizing:border-box;padding:16px 18px 34px;color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.bs:before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.ban.fade .bt{display:block;position:relative}.ban.fade .bs{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none}.ban.fade .bs.on{opacity:1;pointer-events:auto}
.bs .bk{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}.bs .bn{font-size:24px;font-weight:800;line-height:1.15;margin:4px 0;position:relative}.bs .bp{font-size:17px;font-weight:600;opacity:.96;position:relative}.bs .bl{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;margin-bottom:8px;position:relative}
.bs .bnum{position:absolute;right:16px;top:8px;font-size:62px;font-weight:800;opacity:.18;line-height:1}
.ban:not(.nofx) .bs.on .bn,.ban:not(.nofx) .bs.on .bp,.ban:not(.nofx) .bs.on .bk,.ban:not(.nofx) .bs.on .bl{animation:bup .7s both}.ban:not(.nofx) .bs.on .bp{animation-delay:.15s}.ban:not(.nofx) .bs.on .bk{animation-delay:.05s}
.bs .bn,.bs .bp{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:3}.bs .bp{-webkit-line-clamp:2}
.bs.ha{padding:12px 152px 28px 18px}.bs.ha .bn{font-size:19px;-webkit-line-clamp:2}.bs.ha .bp{font-size:15px;-webkit-line-clamp:1}.bs.ha .bl{width:38px;height:38px;margin-bottom:4px}.bs.ha .bw{padding:6px 10px;font-size:12px;right:8px}.bs.ha .bnum{display:none}.ba{position:absolute;right:2px;bottom:20px;width:150px;height:150px;pointer-events:none}
.ban:not(.nofx) .bs.on .ba{animation:bpop .8s .1s both}.ban:not(.nofx) .bs.on .ba .arm{transform-origin:100px 110px;animation:bwave 2.4s 1s ease-in-out infinite}

.ba.ph{width:auto;height:148px;max-width:150px;object-fit:contain;object-position:bottom;right:6px;bottom:16px}.ba.ph:not(.cut){border-radius:16px;border:3px solid #fff;object-fit:cover;height:136px;width:112px;box-shadow:0 4px 14px rgba(0,0,0,.3);bottom:26px}
@keyframes bpop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}@keyframes bwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes bup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ban.nofx .bt{transition:none}.ban.nofx .bs{transition:none}
.bd{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}.bd i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.bd i.on{background:#fff;width:18px;border-radius:4px}
.bw{position:absolute;right:12px;bottom:8px;background:#25d366;color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:20px;text-decoration:none;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:6px}.mi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 16px;text-align:left;font:inherit;color:inherit;display:flex;align-items:center;gap:14px;width:100%}.mi .i{font-size:26px;width:34px;text-align:center}.mi div{flex:1}.mi b{display:block;font-size:16px}.mi small{color:var(--mut);font-size:13px}.mi .ar{color:var(--mut);font-size:22px;flex:0}.gt{margin:26px 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.steps{display:flex;gap:6px;margin:4px 0 18px}.steps i{flex:1;height:6px;border-radius:4px;background:var(--bd)}.steps i.on{background:var(--ac)}.pg label{margin-top:22px}.pg h2{margin-top:30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 14px;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:112px}
.card .i{font-size:28px}.card b{font-size:15px}.card small{color:var(--mut);font-size:12.5px;line-height:1.3}
.card.off{opacity:.55}
h2{font-size:15px;margin:22px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pv{display:flex;flex-direction:column;gap:12px;align-items:center;margin-bottom:12px}
.pv canvas,.pv img{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.pv iframe{width:100%;height:420px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.pv .lab{font-size:12px;color:var(--mut);align-self:flex-start}
.stp{margin:2px 0 6px;position:sticky;top:var(--hh,60px);z-index:4;background:var(--bg);padding:6px 0 4px}.stp .steps{margin:0 0 8px}.stp .t{font-size:17px;font-weight:700;margin:2px 0 2px}.stp .s{font-size:13px;color:var(--mut)}.stn{display:flex;gap:10px;margin:26px 0 8px}.stn .btn{flex:1}.stepsmode .tabs{display:none}.stepsmode .pv>*{flex-shrink:0}.stepsmode .pv{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:12px}@media (max-height:650px){.stp .s{display:none}}.tabs{display:flex;gap:6px;margin:6px 0 14px;position:sticky;top:var(--hh,60px);z-index:4;background:var(--bg);padding:6px 0}
.tabs button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font:inherit;font-size:15px;color:var(--tx)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=email],textarea,select{width:100%;font:inherit;font-size:calc(16px*var(--ts,1));padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
textarea{min-height:92px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px}
.btn.sec{background:var(--card);color:var(--ac);border:1px solid var(--ac)}
.btn.full{width:100%;margin-top:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;padding:0;overflow:hidden;position:relative}
.sw button.on{border-color:var(--tx)}
.sw button i{position:absolute;inset:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}

.xt{width:96px;padding:8px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg,#fff);color:var(--tx)}.xr input[type=color]{width:46px;height:38px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
.xb{padding:6px 12px;min-width:0}.xe{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}.xe.on{border-color:var(--ac)}.xmd textarea,.xmd select{width:100%}
.seg button{padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font:inherit;font-size:15px;color:var(--tx)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.note{font-size:13px;color:var(--mut);line-height:1.45;background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;margin-top:12px}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:15px;color:var(--tx)}
.chk input{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.err{background:#fee2e2;color:#7f1d1d;padding:10px 12px;font-size:13px;display:none}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs canvas,.thumbs img{width:100%;height:auto;border:1px solid var(--bd);border-radius:6px;background:#fff}
.tn{margin:6px 0}.tn label{display:flex;justify-content:space-between;font-size:15px;margin:0}.tn input[type=range]{width:100%;height:34px}
</style>

/* ---- Éditeur de photo : recadrer / effacer ---- */
var PE=null;
function peDraw(){
  var d=document.getElementById("pe_c");if(!d||!PE)return;var c=PE.cv;d.width=c.width;d.height=c.height;var x=d.getContext("2d");x.drawImage(c,0,0);
  if(PE.mode==="cr"){var w=c.width/PE.z,h=c.height/PE.z,x0=(c.width-w)*PE.ox,y0=(c.height-h)*PE.oy;
    x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,0,c.width,y0);x.fillRect(0,y0+h,c.width,c.height-y0-h);x.fillRect(0,y0,x0,h);x.fillRect(x0+w,y0,c.width-x0-w,h);
    x.strokeStyle="#fff";x.lineWidth=Math.max(2,c.width/180);x.strokeRect(x0,y0,w,h);}
}
function pePush(){PE.hist.push(PE.cv.getContext("2d").getImageData(0,0,PE.cv.width,PE.cv.height));if(PE.hist.length>12)PE.hist.shift();}
function peErase(px,py,r){
  var c=PE.cv,x=c.getContext("2d"),W=c.width,H=c.height,R=r*1.6;
  function sm(sx,sy){sx=Math.max(3,Math.min(W-4,sx));sy=Math.max(3,Math.min(H-4,sy));var d=x.getImageData(Math.round(sx)-2,Math.round(sy)-2,5,5).data,a=0,b=0,g=0,n=0;for(var i=0;i<d.length;i+=4){a+=d[i];g+=d[i+1];b+=d[i+2];n++;}return [a/n,g/n,b/n];}
  var L=sm(px-R,py),Rg=sm(px+R,py),Tp=sm(px,py-R),Bt=sm(px,py+R);
  var x0=Math.max(0,Math.floor(px-r)),y0=Math.max(0,Math.floor(py-r)),x1=Math.min(W,Math.ceil(px+r)),y1=Math.min(H,Math.ceil(py+r));
  var id=x.getImageData(x0,y0,x1-x0,y1-y0),d=id.data,w=x1-x0,k;
  for(var yy=y0;yy<y1;yy++)for(var xx=x0;xx<x1;xx++){var dx=xx-px,dy=yy-py,dist=Math.sqrt(dx*dx+dy*dy);if(dist>r)continue;
    var a=dist<r*0.7?1:(1-(dist/r-0.7)/0.3),u=(dx+r)/(2*r),v=(dy+r)/(2*r),o=((yy-y0)*w+(xx-x0))*4,nz=(Math.random()-0.5)*5;
    for(k=0;k<3;k++){var hc=L[k]*(1-u)+Rg[k]*u,vc=Tp[k]*(1-v)+Bt[k]*v,col=(hc+vc)/2+nz;d[o+k]=d[o+k]*(1-a)+col*a;}}
  x.putImageData(id,x0,y0);
}

    var m=Math.min(1,720/Math.max(im.width,im.height)),cv=mk(Math.round(im.width*m),Math.round(im.height*m));cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    PE={cv:cv,hist:[],mode:"er",br:6,z:1,ox:0.5,oy:0.5,down:false};

     +'<div class="row" style="margin-top:22px"><button class="btn sec" id="pe_un">↶ Annuler</button><button class="btn" id="pe_sv">✔ Enregistrer</button></div>';
    var hint=function(){document.getElementById("pe_h").textContent=PE.mode==="er"?"Touche (ou glisse le doigt sur) une tache, une icône ou un défaut pour l'effacer.":"Règle le cadre avec le zoom et les positions, puis touche « Appliquer ».";};

    ["pe_z","pe_x","pe_y"].forEach(function(id){document.getElementById(id).oninput=function(){PE.z=parseFloat(document.getElementById("pe_z").value);PE.ox=parseFloat(document.getElementById("pe_x").value);PE.oy=parseFloat(document.getElementById("pe_y").value);peDraw();};});

  };

  [["coo","📇","Coordonnées","Nom, téléphone, email, adresse"],["logo","🖼","Logo de la fiche","Importer ou retirer le logo"],["pho","📷","Photo de la fiche","Photo, retouche, recadrage, gomme, détourage IA"],["sty","🎨","Couleurs et police","Style habituel de la fiche"],["pck","👁","Aperçu du pack","Carte, profil, affiche"]].forEach(function(m){L.push({ico:m[1],t:m[2],d:m[3]+" · Fiche active",k:m[2]+" "+m[3]+" fiche",go:function(){identity();setActive(BR.id);loadLogoImg(function(){ficheMenu();fichePage(m[0]);});}});});
  L.push({ico:"💾",t:"Sauvegarder mes données",d:"Sauvegarde et restauration · Paramètres",k:"sauvegarde sauvegarder restaurer backup donnees exporter",go:function(){settings();setPage("don",settings,SETM);}});
  L.push({ico:"📂",t:"Mes créations",d:"Reprendre mes créations enregistrées · Accueil",k:"creations brouillons enregistrees historique mes travaux reprendre affiches",go:function(){creations();}});
  L.push({ico:"🔄",t:"Forcer la mise à jour",d:"Mise à jour de l'application · Maintenance",k:"mise a jour update version forcer maintenance",go:function(){settingsAdv();setPage("mai",settingsAdv,ADVM);}});
  L.push({ico:"🔒",t:"Code de verrouillage",d:"Protéger l'application · Sécurité",k:"code pin verrou securite mot de passe",go:function(){settingsAdv();setPage("sec",settingsAdv,ADVM);}});
  L.push({ico:"📢",t:"Bande publicitaire",d:"Animée, fixe ou masquée · Paramètres",k:"bande publicite animee accueil banniere",go:function(){settings();setPage("ban",settings,SETM);}});
  L.push({ico:"✨",t:"Retouche des photos",d:"Retouche automatique de haute qualité · Paramètres",k:"retouche photo qualite nettoyage amelioration",go:function(){settings();setPage("pht",settings,SETM);}});
  L.push({ico:"🔢",t:"Numérotation des factures",d:"Préfixe et prochain numéro · Paramètres avancés",k:"facture numero numerotation prefixe",go:function(){settingsAdv();setPage("num",settingsAdv,ADVM);}});
  return L;
}
function searchScreen(){
  screen("Rechercher",home);
  app.innerHTML='<input type="search" id="q_in" placeholder="Rechercher : affiche, facture, photo, logo…" autocomplete="off" style="font-size:17px;padding:14px"><div id="q_out" class="menu" style="margin-top:14px"></div>';
  var L=searchIndex(),inp=document.getElementById("q_in"),out=document.getElementById("q_out");
  function show(){
    var q=norm(inp.value).trim(),r;
    if(!q){r=L.filter(function(x){return /Service/.test(x.d);}).slice(0,6);out.innerHTML='<div class="hint" style="margin:0">Services les plus utilisés. Tape un mot pour chercher partout dans l\'application.</div>';}
    else{var ws=q.split(/\s+/);r=L.map(function(x){var h=norm(x.t+" "+x.k+" "+x.d),sc=0,ok=true;ws.forEach(function(w){var i=h.indexOf(w);if(i<0)ok=false;else sc+=(norm(x.t).indexOf(w)>=0?3:1);});return ok?{x:x,sc:sc}:null;}).filter(Boolean).sort(function(a,b){return b.sc-a.sc;}).map(function(o){return o.x;}).slice(0,25);
      out.innerHTML=r.length?"":'<div class="note" style="margin:0">Aucun résultat pour « '+esc(inp.value)+' ». Essaie un autre mot (exemple : « photo », « facture », « sauvegarde »).</div>';}
    out.insertAdjacentHTML("beforeend",r.map(function(x,i){return '<button class="mi" data-i="'+i+'"><span class="i">'+x.ico+'</span><div><b>'+esc(x.t)+'</b><small>'+esc(x.d)+'</small></div><span class="ar">›</span></button>';}).join(""));
    Array.prototype.forEach.call(out.querySelectorAll(".mi"),function(b){b.onclick=function(){r[+b.getAttribute("data-i")].go();};});
  }
  inp.addEventListener("input",show);show();setTimeout(function(){try{inp.focus();}catch(e){}},80);
}
/* ============ Verrouillage ============ */
function hashPin(v,cb){
  try{if(window.crypto&&crypto.subtle){crypto.subtle.digest("SHA-256",new TextEncoder().encode("yiri:"+v)).then(function(b){cb(Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join(""));}).catch(function(){cb("p"+btoa(v));});return;}}catch(e){}
  cb("p"+btoa(v));
}
function lockScreen(){
  if(!SET.pin)return;
  var ov=document.createElement("div");ov.id="lock";ov.style.cssText="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center";
  ov.innerHTML='<div style="font-size:44px">🔒</div><div style="font-size:20px;font-weight:700">YiriDesign</div><div style="color:var(--mut)">Saisis ton code</div><input type="password" inputmode="numeric" maxlength="4" id="lk" style="max-width:180px;text-align:center;font-size:28px;letter-spacing:10px"><div id="lke" class="danger" style="border:0;min-height:20px"></div>';
  document.body.appendChild(ov);var lk=document.getElementById("lk");setTimeout(function(){lk.focus();},50);
  lk.oninput=function(){if(lk.value.length===4){hashPin(lk.value,function(hh){if(hh===SET.pin){ov.remove();}else{document.getElementById("lke").textContent="Code incorrect";lk.value="";}});}};
}

function setHH(){try{var h=document.querySelector("header");if(h)document.documentElement.style.setProperty("--hh",h.offsetHeight+"px");}catch(e){}}
setHH();window.addEventListener("resize",setHH);
backB.onclick=function(){VID.stop=true;(BACK||home)();};
/* Bouton « Retour » du téléphone : on revient d'un écran, ou on demande avant de quitter */
(function(){
  var leaving=false,guard=true;
  try{history.replaceState({yiri:0},"");history.pushState({yiri:1},"");}catch(e){guard=false;}
  if(!guard)return;
  function askQuit(){
    if(document.getElementById("yq"))return;
    var o=document.createElement("div");o.id="yq";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.style.cssText="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px";
    o.innerHTML='<div style="background:var(--card,#fff);color:var(--tx,#111);border-radius:18px;padding:22px 20px 16px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)"><div style="font-size:19px;font-weight:800;margin-bottom:6px">Quitter l\'application ?</div><div style="font-size:15px;opacity:.8;margin-bottom:18px;line-height:1.4">Tes créations sont enregistrées automatiquement sur ce téléphone.</div><button class="btn full" id="yq_n" style="min-height:48px">Rester dans l\'application</button><button class="btn sec full danger" id="yq_y" style="min-height:48px;margin-top:10px">Quitter</button></div>';
    document.body.appendChild(o);
    o.onclick=function(e){if(e.target===o)o.remove();};
    document.getElementById("yq_n").onclick=function(){o.remove();};
    document.getElementById("yq_y").onclick=function(){o.remove();quit();};
    try{document.getElementById("yq_n").focus();}catch(e){}
  }
  function quit(){
    leaving=true;
    for(var i=0;i<14;i++)(function(i){setTimeout(function(){try{history.back();}catch(e){}},i*90);})(i);
    setTimeout(function(){try{window.close();}catch(e){}},1500);
    setTimeout(function(){leaving=false;armed=true;try{history.pushState({yiri:1},"");}catch(e){}toast("Appuie sur le bouton d'accueil de ton téléphone pour fermer");},2600);
  }
  window.__askQuit=askQuit;
  /* Chrome ignore les entrées d'historique ajoutées sans toucher l'écran : on en ajoute une vraie dès qu'on touche */
  var armed=true;
  function arm(){ if(!armed||leaving)return;
    try{ if(navigator.userActivation&&!navigator.userActivation.isActive)return; /* seul un vrai geste compte pour Chrome */
      history.pushState({yiri:1},""); armed=false; }catch(e){} }
  ["pointerup","touchend","mouseup","click","keydown"].forEach(function(ev){document.addEventListener(ev,arm,true);});
  window.addEventListener("popstate",function(){
    if(leaving)return;
    armed=true;
    try{history.pushState({yiri:1},"");}catch(e){}
    if(window.__bt){window.__bt();return;}
    var q=document.getElementById("yq");if(q){q.remove();return;}
    var vo=document.querySelector(".ovl");if(vo){vo.remove();return;}
    if(backB.style.display!=="none"){backB.onclick();return;}
    if(SET.confirmExit===false){quit();return;}
    askQuit();
  });
})();
