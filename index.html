<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#0f766e;--ac2:#115e59;--bd:#e3e1db}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:calc(16px*var(--ts,1))}
html[data-theme=dark]{--bg:#121414;--card:#1f2323;--tx:#ececec;--mut:#9aa3a3;--bd:#343a3a;--ac:#14a094;--ac2:#0f766e}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;font-weight:700;flex:1}
html[data-theme=dark] header{background:#0b3f3b}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;min-height:44px;min-width:44px}
html[data-theme=dark] .danger{color:#fca5a5!important;border-color:#fca5a5!important}.danger{color:#b91c1c;border-color:#b91c1c}
html[data-theme=dark] .btn:not(.sec),html[data-theme=dark] .tabs button.on,html[data-theme=dark] .seg button.on{background:var(--ac2);border-color:var(--ac2)}
main{padding:16px;max-width:760px;margin:0 auto;padding-bottom:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ban{position:relative;overflow:hidden;border-radius:18px;height:178px;margin:0 0 10px;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#222}
.bt{display:flex;height:100%;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.bs{flex:0 0 100%;box-sizing:border-box;padding:16px 18px 34px;color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.bs:before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.ban.fade .bt{display:block;position:relative}.ban.fade .bs{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none}.ban.fade .bs.on{opacity:1;pointer-events:auto}
.bs .bk{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}.bs .bn{font-size:24px;font-weight:800;line-height:1.15;margin:4px 0;position:relative}.bs .bp{font-size:17px;font-weight:600;opacity:.96;position:relative}.bs .bl{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;margin-bottom:8px;position:relative}
.bs .bnum{position:absolute;right:16px;top:8px;font-size:62px;font-weight:800;opacity:.18;line-height:1}
.ban:not(.nofx) .bs.on .bn,.ban:not(.nofx) .bs.on .bp,.ban:not(.nofx) .bs.on .bk,.ban:not(.nofx) .bs.on .bl{animation:bup .7s both}.ban:not(.nofx) .bs.on .bp{animation-delay:.15s}.ban:not(.nofx) .bs.on .bk{animation-delay:.05s}
.bs .bn,.bs .bp{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:3}.bs .bp{-webkit-line-clamp:2}
.bs.ha{padding:12px 152px 28px 18px}.bs.ha .bn{font-size:19px;-webkit-line-clamp:2}.bs.ha .bp{font-size:15px;-webkit-line-clamp:1}.bs.ha .bl{width:38px;height:38px;margin-bottom:4px}.bs.ha .bw{padding:6px 10px;font-size:12px;right:8px}.bs.ha .bnum{display:none}.ba{position:absolute;right:2px;bottom:20px;width:150px;height:150px;pointer-events:none}
.ban:not(.nofx) .bs.on .ba{animation:bpop .8s .1s both}.ban:not(.nofx) .bs.on .ba .arm{transform-origin:100px 110px;animation:bwave 2.4s 1s ease-in-out infinite}

.ba.ph{width:auto;height:148px;max-width:150px;object-fit:contain;object-position:bottom;right:6px;bottom:16px}.ba.ph:not(.cut){border-radius:16px;border:3px solid #fff;object-fit:cover;height:136px;width:112px;box-shadow:0 4px 14px rgba(0,0,0,.3);bottom:26px}
@keyframes bpop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}@keyframes bwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes bup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ban.nofx .bt{transition:none}.ban.nofx .bs{transition:none}
.bd{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}.bd i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.bd i.on{background:#fff;width:18px;border-radius:4px}
.bw{position:absolute;right:12px;bottom:8px;background:#25d366;color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:20px;text-decoration:none;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:6px}.mi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 16px;text-align:left;font:inherit;color:inherit;display:flex;align-items:center;gap:14px;width:100%}.mi .i{font-size:26px;width:34px;text-align:center}.mi div{flex:1}.mi b{display:block;font-size:16px}.mi small{color:var(--mut);font-size:13px}.mi .ar{color:var(--mut);font-size:22px;flex:0}.gt{margin:26px 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.steps{display:flex;gap:6px;margin:4px 0 18px}.steps i{flex:1;height:6px;border-radius:4px;background:var(--bd)}.steps i.on{background:var(--ac)}.pg label{margin-top:22px}.pg h2{margin-top:30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 14px;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:112px}
.card .i{font-size:28px}.card b{font-size:15px}.card small{color:var(--mut);font-size:12.5px;line-height:1.3}
.card.off{opacity:.55}
h2{font-size:15px;margin:22px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pv{display:flex;flex-direction:column;gap:12px;align-items:center;margin-bottom:12px}
.pv canvas,.pv img{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.pv iframe{width:100%;height:420px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.pv .lab{font-size:12px;color:var(--mut);align-self:flex-start}
.stp{margin:2px 0 6px;position:sticky;top:var(--hh,60px);z-index:4;background:var(--bg);padding:6px 0 4px}.stp .steps{margin:0 0 8px}.stp .t{font-size:17px;font-weight:700;margin:2px 0 2px}.stp .s{font-size:13px;color:var(--mut)}.stn{display:flex;gap:10px;margin:26px 0 8px}.stn .btn{flex:1}.stepsmode .tabs{display:none}.stepsmode .pv>*{flex-shrink:0}.stepsmode .pv{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:12px}@media (max-height:650px){.stp .s{display:none}}.tabs{display:flex;gap:6px;margin:6px 0 14px;position:sticky;top:var(--hh,60px);z-index:4;background:var(--bg);padding:6px 0}
.tabs button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font:inherit;font-size:15px;color:var(--tx)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=email],textarea,select{width:100%;font:inherit;font-size:calc(16px*var(--ts,1));padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
textarea{min-height:92px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px}
.btn.sec{background:var(--card);color:var(--ac);border:1px solid var(--ac)}
.btn.full{width:100%;margin-top:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;padding:0;overflow:hidden;position:relative}
.sw button.on{border-color:var(--tx)}
.sw button i{position:absolute;inset:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
img[style*="object-fit:cover"],.ba.ph:not(.cut){object-position:50% 12%}
.xmd{border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:24px;background:var(--card)}.xmd summary{font-weight:700;font-size:16px;cursor:pointer}
.xmd h4{margin:18px 0 6px;font-size:15px}.xr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.xl{min-width:96px;font-size:14px}
.xt{width:96px;padding:8px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg,#fff);color:var(--tx)}.xr input[type=color]{width:46px;height:38px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
.xb{padding:6px 12px;min-width:0}.xe{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}.xe.on{border-color:var(--ac)}.xmd textarea,.xmd select{width:100%}

.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:15px;color:var(--tx)}
.chk input{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:9999;max-width:90%;text-align:center}
.err{background:#fee2e2;color:#7f1d1d;padding:10px 12px;font-size:13px;display:none}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs canvas,.thumbs img{width:100%;height:auto;border:1px solid var(--bd);border-radius:6px;background:#fff}
.tn{margin:6px 0}.tn label{display:flex;justify-content:space-between;font-size:15px;margin:0}.tn input[type=range]{width:100%;height:34px}

<script>
/* Écran de secours : si l'application ne démarre pas en 5 s, on montre l'erreur et un bouton de réparation */
(function(){window.__boot=0;var E=[];
  window.addEventListener("error",function(e){E.push((e.message||"erreur")+(e.lineno?" (ligne "+e.lineno+")":""));});
  window.addEventListener("unhandledrejection",function(e){E.push("promesse: "+(e.reason&&e.reason.message||e.reason||""));});
  function show(){ if(window.__boot||document.getElementById("rescue"))return;
    var d=document.createElement("div");d.id="rescue";d.style.cssText="position:fixed;inset:0;z-index:99999;background:#fff;color:#111;padding:22px;font:16px/1.45 sans-serif;overflow:auto";
    d.innerHTML='<h2 style="margin:0 0 8px">YiriDesign n\'a pas pu démarrer</h2><p>Appuie sur « Réparer » : cela vide la copie enregistrée de l\'application (tes fiches et créations ne sont <b>pas</b> effacées) et recharge.</p><button id="rs_go" style="font:inherit;font-weight:700;padding:14px 18px;border:0;border-radius:12px;background:#0f766e;color:#fff;width:100%">🔧 Réparer</button><p style="margin-top:14px;font-size:13px;color:#555">Détail technique (à envoyer au support) :<br><code style="word-break:break-all">'+(E.join(" | ")||"aucune erreur JavaScript détectée")+' · '+navigator.userAgent.slice(0,120)+'</code></p>';
    document.body.appendChild(d);
    document.getElementById("rs_go").onclick=function(){var jobs=[];
      try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));}catch(e){}
      try{if(window.caches)jobs.push(caches.keys().then(function(k){return Promise.all(k.filter(function(x){return x!=="yiri-lib";}).map(function(x){return caches.delete(x);}));}));}catch(e){}
      Promise.all(jobs).catch(function(){}).then(function(){location.reload();});};}
  setTimeout(show,5000);
})();
</script>

}
function enhancePhoto(im){
  var lv=SET.photoAuto||"natural";if(lv==="off"||!im||!im.width)return im;
  var st=lv==="strong"||lv==="studio"?1:0.65,W0=im.width,H0=im.height,up=1;
  var mx=Math.max(W0,H0);if(lv==="studio"){if(mx<1000)up=1000/mx;else if(mx>1300)up=1300/mx;}else if(mx>1500)up=1500/mx;

    for(yy0=y0c;yy0<y1c;yy0+=2)for(xx0=x0c;xx0<x1c;xx0+=2){var pp=(yy0*W+xx0)*4;cs+=(d[pp]*77+d[pp+1]*150+d[pp+2]*29)>>8;cc++;}
    var cmean=cc?cs/cc:mean;
    for(i=0;i<256;i++){acc+=hist[i];if(acc>=cnt*0.01){lo=i;break;}}acc=0;
    for(i=255;i>=0;i--){acc+=hist[i];if(acc>=cnt*0.01){hi=i;break;}}

    var g=Math.log(122/255)/Math.log(Math.max(40,Math.min(215,(cmean-lo)/Math.max(1,hi-lo)*255))/255);g=Math.max(0.74,Math.min(1.08,g));g=1+(g-1)*st;

    if(lv==="studio"){studioDetail(d,W,H);}
    else{

      for(yy=1;yy<H-1;yy++)for(xx=1;xx<W-1;xx++){var p=(yy*W+xx)*4;if(d[p+3]<20)continue;

/* ===== Retouche de la photo : automatique, manuelle (réglages faits par l'utilisateur) ou aucune ===== */
var PDEF={b:0,c:0,s:0,k:0,l:0};
function copyPA(p){var o={},k;for(k in PDEF)o[k]=(p&&p[k]!=null)?p[k]:PDEF[k];return o;}
function defMode(){return SET.photoAuto==="off"?"off":"auto";}
function photoAdjust(src,p,maxDim){
  var sc=Math.min(1,(maxDim||1200)/Math.max(src.width,src.height)),W=Math.max(1,Math.round(src.width*sc)),H=Math.max(1,Math.round(src.height*sc)),c=mk(W,H),x=c.getContext("2d");
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(src,0,0,W,H);

    var id=x.getImageData(0,0,W,H),d=id.data,n=W*H,i,o,k;
    function luma(){var Y=new Float32Array(n),q;for(q=0;q<n;q++)Y[q]=(d[q*4]*77+d[q*4+1]*150+d[q*4+2]*29)/256;return Y;}
    if(p.l>0){

    }
    if(p.k>0){
      var Y1=luma(),rb=Math.max(1,Math.round(Math.max(W,H)/650)),bs=boxBlur(boxBlur(Y1,W,H,rb),W,H,rb),am=p.k/100*1.7;

function photoProc(base,mode,pa,maxDim){
  if(!base)return null;
  if(mode==="off")return base;
  if(mode==="manual")return photoAdjust(base,pa,maxDim);
  return enhancePhoto(base);
}
var TPRE=[["☀ Photo sombre",{b:35,c:12,s:5,k:20,l:0}],["🔍 Photo floue",{b:0,c:10,s:0,k:80,l:0}],["🕰 Photo ancienne",{b:10,c:25,s:-8,k:50,l:30}],["🌤 Photo trop claire",{b:-25,c:18,s:8,k:15,l:0}],["⚫ Noir et blanc",{b:0,c:12,s:-50,k:20,l:0}],["🙂 Peau lisse",{b:5,c:0,s:0,k:15,l:60}]];

function tuneHtml(p,pm,pa){
  var h='<label>Retouche de la photo</label><div class="seg" id="'+p+'_pm">'+[["auto","Automatique"],["manual","Moi-même"],["off","Aucune"]].map(function(o){return '<button data-v="'+o[0]+'"'+(pm===o[0]?' class="on"':'')+'>'+o[1]+'</button>';}).join("")+'</div>';
  h+='<div class="hint" style="margin:10px 0 4px">Photo difficile ? Touche un préréglage, puis affine avec les curseurs :</div><div class="seg" id="'+p+'_pre">'+TPRE.map(function(t,i){return '<button data-i="'+i+'">'+t[0]+'</button>';}).join("")+'</div>';
  h+='<div id="'+p+'_sl" style="display:'+(pm==="manual"?"block":"none")+'">';
  TUNES.forEach(function(t){var v=pa[t[0]]||0;h+='<div class="tn"><label for="'+p+'_'+t[0]+'">'+t[1]+' <b id="'+p+'_'+t[0]+'v">'+(v>0&&t[2]<0?"+":"")+v+'</b></label><input type="range" id="'+p+'_'+t[0]+'" min="'+t[2]+'" max="'+t[3]+'" step="1" value="'+v+'"></div>';});
  h+='<div class="row" style="margin-top:10px"><button class="btn sec" id="'+p+'_rst">↺ Remettre à zéro</button></div></div>';
  h+='<div class="hint" id="'+p+'_hint">'+(pm==="auto"?'Automatique : lumière et netteté améliorées toutes seules (niveau réglable dans Paramètres › Retouche des photos).':(pm==="manual"?'Règle chaque curseur à ton goût. L\'aperçu change en direct.':'Aucune : la photo reste telle que tu l\'as prise.'))+'</div>';
  return h;
}
/* st = objet qui porte pm et pa (ST ou la fiche BR) ; apply(rapide) recalcule et réaffiche */
function tuneBind(p,st,apply){
  var seg=document.getElementById(p+"_pm");if(!seg)return;
  var sl=document.getElementById(p+"_sl"),hint=document.getElementById(p+"_hint");
  var HT={auto:"Automatique : lumière et netteté améliorées toutes seules (niveau réglable dans Paramètres › Retouche des photos).",manual:"Règle chaque curseur à ton goût. L'aperçu change en direct.",off:"Aucune : la photo reste telle que tu l'as prise."};
  Array.prototype.forEach.call(seg.querySelectorAll("button"),function(b){b.onclick=function(){
    st.pm=b.getAttribute("data-v");if(!st.pa)st.pa=copyPA();
    Array.prototype.forEach.call(seg.querySelectorAll("button"),function(o){o.classList.toggle("on",o===b);});
    sl.style.display=st.pm==="manual"?"block":"none";hint.textContent=HT[st.pm];apply(false);};});
  var pre=document.getElementById(p+"_pre");
  if(pre)Array.prototype.forEach.call(pre.querySelectorAll("button"),function(b){b.onclick=function(){var v=TPRE[+b.getAttribute("data-i")][1];st.pm="manual";st.pa=copyPA(v);
    Array.prototype.forEach.call(seg.querySelectorAll("button"),function(o){o.classList.toggle("on",o.getAttribute("data-v")==="manual");});
    sl.style.display="block";hint.textContent=HT.manual;
    TUNES.forEach(function(t){var el=document.getElementById(p+"_"+t[0]),vv=document.getElementById(p+"_"+t[0]+"v");if(el){el.value=st.pa[t[0]]||0;var n=st.pa[t[0]]||0;vv.textContent=(n>0&&t[2]<0?"+":"")+n;}});
    apply(false);toast("Préréglage appliqué : affine avec les curseurs");};});
  var tmr=0;
  TUNES.forEach(function(t){var el=document.getElementById(p+"_"+t[0]),vv=document.getElementById(p+"_"+t[0]+"v");if(!el)return;
    function show(){var v=parseInt(el.value)||0;vv.textContent=(v>0&&t[2]<0?"+":"")+v;return v;}
    el.addEventListener("input",function(){if(!st.pa)st.pa=copyPA();st.pa[t[0]]=show();clearTimeout(tmr);tmr=setTimeout(function(){apply(true);},90);});
    el.addEventListener("change",function(){if(!st.pa)st.pa=copyPA();st.pa[t[0]]=show();clearTimeout(tmr);apply(false);});});
  var rs=document.getElementById(p+"_rst");if(rs)rs.onclick=function(){st.pa=copyPA();TUNES.forEach(function(t){var el=document.getElementById(p+"_"+t[0]),vv=document.getElementById(p+"_"+t[0]+"v");if(el){el.value=0;vv.textContent="0";}});apply(false);};
}
function toCanvas(im){var c=mk(im.width,im.height);c.getContext("2d").drawImage(im,0,0);return c;}
function cropBars(c){
  var W=c.width,H=c.height,d=c.getContext("2d").getImageData(0,0,W,H).data;
  function dk(i){return (d[i]*77+d[i+1]*150+d[i+2]*29)/256<12;}
  function row(y,a,b){var n=0,t=0,st=Math.max(1,(b-a)>>7);for(var q=a;q<b;q+=st){t++;if(dk((y*W+q)*4))n++;}return n/Math.max(1,t);}
  function col(xx,a,b){var n=0,t=0,st=Math.max(1,(b-a)>>7);for(var q=a;q<b;q+=st){t++;if(dk((q*W+xx)*4))n++;}return n/Math.max(1,t);}
  // avance tant que la ligne est noire ; tolère de petites interruptions (icônes, texte)
  function scan(len,lim,f){var edge=0,gap=0,gmax=Math.max(4,Math.round(len*0.03)),last=0;
    for(var i=0;i<lim;i++){if(f(i)>0.68){edge=i+1;gap=0;}else{gap++;if(gap>gmax)break;}}return edge;}
  var top=scan(H,Math.floor(H*0.6),function(i){return row(i,0,W);});
  var bot=H-scan(H,Math.floor(H*0.4),function(i){return row(H-1-i,0,W);});
  var l=scan(W,Math.floor(W*0.4),function(i){return col(i,top,bot);});

  var o=mk(nw,nh);o.getContext("2d").drawImage(c,l,top,nw,nh,0,0,nw,nh);o._bars=true;return o;
}
function faceCrop(c,cb){
  try{
    if(!("FaceDetector" in window)){cb(c,false);return;}
    var fd=new FaceDetector({fastMode:true,maxDetectedFaces:4});
    fd.detect(c).then(function(fs){
      if(!fs||!fs.length){cb(c,false);return;}
      var W=c.width,H=c.height,cw,ch,x0,y0;
      if(fs.length>=2){
        /* plusieurs visages (couple, famille) : on garde tout le groupe */
        var ax=1e9,ay=1e9,bx=0,by=0,mh=0;fs.forEach(function(q){var r=q.boundingBox;ax=Math.min(ax,r.x);ay=Math.min(ay,r.y);bx=Math.max(bx,r.x+r.width);by=Math.max(by,r.y+r.height);mh=Math.max(mh,r.height);});
        var gw=bx-ax;cw=Math.min(W,gw+Math.max(gw*0.7,mh*2.2));ch=Math.min(H,(by-ay)+mh*3.2);
        var cxg=(ax+bx)/2;x0=Math.max(0,Math.min(W-cw,cxg-cw/2));y0=Math.max(0,Math.min(H-ch,ay-mh*1.1));
      }else{
        var f=fs[0].boundingBox,fw=f.width,cx=f.x+fw/2;cw=Math.min(W,fw*3.0);ch=Math.min(H,fw*3.4);
        if(cw/ch>0.9&&ch<H){ch=Math.min(H,cw/0.88);}
        x0=Math.max(0,Math.min(W-cw,cx-cw/2));y0=Math.max(0,Math.min(H-ch,f.y-fw*0.85));
      }
      if(cw>=W*0.97&&ch>=H*0.97){cb(c,true);return;}
      var o=mk(Math.round(cw),Math.round(ch));o.getContext("2d").drawImage(c,x0,y0,cw,ch,0,0,o.width,o.height);cb(o,true);
    }).catch(function(){cb(c,false);});
  }catch(e){cb(c,false);}
}
function smartPhoto(im,cb,whole){
  var c=toCanvas(im);if(SET.photoSmart===false){cb(c);return;}
  var bars=false;try{c=cropBars(c);bars=!!c._bars;}catch(e){}
  if(whole){cb(c);return;}
  faceCrop(c,function(o,face){
    // capture d'écran sans visage détecté : on retire aussi les bords (icônes, date)
    if(bars&&!face){var W=o.width,H=o.height,mx=Math.round(W*0.12),mb=Math.round(H*0.08),t=Math.round(H*0.02),q=mk(W-2*mx,H-mb-t);q.getContext("2d").drawImage(o,mx,t,q.width,q.height,0,0,q.width,q.height);o=q;}
    cb(o);
  });
}
function aiCutout(im,cb){
  if(!navigator.onLine){toast("Pas de connexion internet : cette retouche en a besoin.");return;}
  if(!im){toast("Ajoute d'abord une photo.");return;}
  toast("Retouche IA en cours… la première fois, le téléchargement peut prendre 1 à 2 minutes.");
  var cv=mk(im.width,im.height);cv.getContext("2d").drawImage(im,0,0);
  cv.toBlob(function(bl){
    import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm").then(function(m){
      var f=m.removeBackground||(m.default&&m.default.removeBackground)||m.default;
      return f(bl,{output:{format:"image/png"}});
    }).then(function(out){var u=URL.createObjectURL(out),r=new Image();r.onload=function(){cb(r);URL.revokeObjectURL(u);toast("Photo détourée");};r.src=u;})
    .catch(function(){toast("La retouche IA n'a pas pu s'exécuter (connexion ou téléphone trop lent).");});
  },"image/png");
}

var PE=null;
function peDraw(){
  var d=document.getElementById("pe_c");if(!d||!PE)return;var c=PE.cv;d.width=c.width;d.height=c.height;var x=d.getContext("2d");x.drawImage(c,0,0);
  if(PE.mode==="cr"){var w=c.width/PE.z,h=c.height/PE.z,x0=(c.width-w)*PE.ox,y0=(c.height-h)*PE.oy;
    x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,0,c.width,y0);x.fillRect(0,y0+h,c.width,c.height-y0-h);x.fillRect(0,y0,x0,h);x.fillRect(x0+w,y0,c.width-x0-w,h);
    x.strokeStyle="#fff";x.lineWidth=Math.max(2,c.width/180);x.strokeRect(x0,y0,w,h);}
}
function pePush(){PE.hist.push(PE.cv.getContext("2d").getImageData(0,0,PE.cv.width,PE.cv.height));if(PE.hist.length>12)PE.hist.shift();}
function peErase(px,py,r){
  var c=PE.cv,x=c.getContext("2d"),W=c.width,H=c.height,R=r*1.6;
  function sm(sx,sy){sx=Math.max(3,Math.min(W-4,sx));sy=Math.max(3,Math.min(H-4,sy));var d=x.getImageData(Math.round(sx)-2,Math.round(sy)-2,5,5).data,a=0,b=0,g=0,n=0;for(var i=0;i<d.length;i+=4){a+=d[i];g+=d[i+1];b+=d[i+2];n++;}return [a/n,g/n,b/n];}
  var L=sm(px-R,py),Rg=sm(px+R,py),Tp=sm(px,py-R),Bt=sm(px,py+R);
  var x0=Math.max(0,Math.floor(px-r)),y0=Math.max(0,Math.floor(py-r)),x1=Math.min(W,Math.ceil(px+r)),y1=Math.min(H,Math.ceil(py+r));
  var id=x.getImageData(x0,y0,x1-x0,y1-y0),d=id.data,w=x1-x0,k;
  for(var yy=y0;yy<y1;yy++)for(var xx=x0;xx<x1;xx++){var dx=xx-px,dy=yy-py,dist=Math.sqrt(dx*dx+dy*dy);if(dist>r)continue;
    var a=dist<r*0.7?1:(1-(dist/r-0.7)/0.3),u=(dx+r)/(2*r),v=(dy+r)/(2*r),o=((yy-y0)*w+(xx-x0))*4,nz=(Math.random()-0.5)*5;
    for(k=0;k<3;k++){var hc=L[k]*(1-u)+Rg[k]*u,vc=Tp[k]*(1-v)+Bt[k]*v,col=(hc+vc)/2+nz;d[o+k]=d[o+k]*(1-a)+col*a;}}
  x.putImageData(id,x0,y0);
}
