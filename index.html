<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#0f766e;--ac2:#115e59;--bd:#e3e1db}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:calc(16px*var(--ts,1))}
html[data-theme=dark]{--bg:#121414;--card:#1f2323;--tx:#ececec;--mut:#9aa3a3;--bd:#343a3a;--ac:#14a094;--ac2:#0f766e}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;font-weight:700;flex:1}
html[data-theme=dark] header{background:#0b3f3b}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px}
main{padding:16px;max-width:760px;margin:0 auto;padding-bottom:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ban{position:relative;overflow:hidden;border-radius:18px;height:178px;margin:0 0 10px;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#222}
.bt{display:flex;height:100%;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.bs{flex:0 0 100%;box-sizing:border-box;padding:16px 18px 34px;color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.bs:before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.ban.fade .bt{display:block;position:relative}.ban.fade .bs{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none}.ban.fade .bs.on{opacity:1;pointer-events:auto}
.bs .bk{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}.bs .bn{font-size:24px;font-weight:800;line-height:1.15;margin:4px 0;position:relative}.bs .bp{font-size:17px;font-weight:600;opacity:.96;position:relative}.bs .bl{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;margin-bottom:8px;position:relative}
.bs .bnum{position:absolute;right:16px;top:8px;font-size:62px;font-weight:800;opacity:.18;line-height:1}
.ban:not(.nofx) .bs.on .bn,.ban:not(.nofx) .bs.on .bp,.ban:not(.nofx) .bs.on .bk,.ban:not(.nofx) .bs.on .bl{animation:bup .7s both}.ban:not(.nofx) .bs.on .bp{animation-delay:.15s}.ban:not(.nofx) .bs.on .bk{animation-delay:.05s}
@keyframes bup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ban.nofx .bt{transition:none}.ban.nofx .bs{transition:none}
.bd{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}.bd i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.bd i.on{background:#fff;width:18px;border-radius:4px}
.bw{position:absolute;right:12px;bottom:8px;background:#25d366;color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:20px;text-decoration:none;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:6px}.mi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 16px;text-align:left;font:inherit;color:inherit;display:flex;align-items:center;gap:14px;width:100%}.mi .i{font-size:26px;width:34px;text-align:center}.mi div{flex:1}.mi b{display:block;font-size:16px}.mi small{color:var(--mut);font-size:13px}.mi .ar{color:var(--mut);font-size:22px;flex:0}.gt{margin:26px 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.steps{display:flex;gap:6px;margin:4px 0 18px}.steps i{flex:1;height:6px;border-radius:4px;background:var(--bd)}.steps i.on{background:var(--ac)}.pg label{margin-top:22px}.pg h2{margin-top:30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 14px;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:112px}
.card .i{font-size:28px}.card b{font-size:15px}.card small{color:var(--mut);font-size:12.5px;line-height:1.3}
.card.off{opacity:.55}
h2{font-size:15px;margin:22px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pv{display:flex;flex-direction:column;gap:12px;align-items:center;margin-bottom:12px}
.pv canvas,.pv img{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.pv iframe{width:100%;height:420px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.pv .lab{font-size:12px;color:var(--mut);align-self:flex-start}
.tabs{display:flex;gap:6px;margin:6px 0 14px;position:sticky;top:52px;z-index:4;background:var(--bg);padding:6px 0}
.tabs button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font:inherit;font-size:15px;color:var(--tx)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:calc(16px*var(--ts,1));padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
textarea{min-height:92px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px}
.btn.sec{background:var(--card);color:var(--ac);border:1px solid var(--ac)}
.btn.full{width:100%;margin-top:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;padding:0;overflow:hidden;position:relative}
.sw button.on{border-color:var(--tx)}
.sw button i{position:absolute;inset:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font:inherit;font-size:15px;color:var(--tx)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.note{font-size:13px;color:var(--mut);line-height:1.45;background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;margin-top:12px}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:15px;color:var(--tx)}
.chk input{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.err{background:#fee2e2;color:#7f1d1d;padding:10px 12px;font-size:13px;display:none}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs canvas,.thumbs img{width:100%;height:auto;border:1px solid var(--bd);border-radius:6px;background:#fff}
</style>

/* ---- Retouche des photos ---- */
function enhancePhoto(im){
  var lv=SET.photoAuto||"natural";if(lv==="off"||!im||!im.width)return im;
  var st=lv==="strong"?1:0.65,W=im.width,H=im.height,c=mk(W,H),x=c.getContext("2d");
  try{x.drawImage(im,0,0);var id=x.getImageData(0,0,W,H),d=id.data,n=W*H,hist=new Uint32Array(256),cnt=0,sum=0,i,l;
    for(i=0;i<n;i++){if(d[i*4+3]<20)continue;l=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;hist[l]++;cnt++;sum+=l;}
    if(!cnt)return im;
    var mean=sum/cnt,lo=0,hi=255,acc=0;
    for(i=0;i<256;i++){acc+=hist[i];if(acc>=cnt*0.01){lo=i;break;}}acc=0;
    for(i=255;i>=0;i--){acc+=hist[i];if(acc>=cnt*0.01){hi=i;break;}}
    if(hi-lo<60){lo=Math.max(0,lo-10);hi=Math.min(255,hi+10);}
    var g=Math.log(120/255)/Math.log(Math.max(30,Math.min(225,(mean-lo)/Math.max(1,hi-lo)*255))/255);g=Math.max(0.7,Math.min(1.5,g));g=1+(g-1)*st;
    var lut=new Uint8ClampedArray(256);for(i=0;i<256;i++){var v=Math.max(0,Math.min(1,(i-lo)/Math.max(1,hi-lo)));v=Math.pow(v,g);lut[i]=Math.round(i*(1-st)+v*255*st);}
    var sat=1+0.16*st;
    for(i=0;i<n;i++){var o=i*4,r=lut[d[o]],gg=lut[d[o+1]],b=lut[d[o+2]],y=(r*77+gg*150+b*29)>>8;

function makePdf(c){

  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw.toFixed(2)+" "+ph.toFixed(2)+"] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>");
  var cs="q "+pw.toFixed(2)+" 0 0 "+ph.toFixed(2)+" 0 0 cm /Im0 Do Q";
  obj(4,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  off[5]=len;addS("5 0 obj\n<< /Type /XObject /Subtype /Image /Width "+c.width+" /Height "+c.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");add(jpg);addS("\nendstream\nendobj\n");

function makePdfMulti(pages){
  var enc=new TextEncoder(),parts=[],off=[],len=0,n=pages.length;

    var pi=3+i*3,ci=pi+1,ii=pi+2,nm="Im"+i;
    obj(pi,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw.toFixed(2)+" "+ph.toFixed(2)+"] /Resources << /XObject << /"+nm+" "+ii+" 0 R >> >> /Contents "+ci+" 0 R >>");
    var cs="q "+pw.toFixed(2)+" 0 0 "+ph.toFixed(2)+" 0 0 cm /"+nm+" Do Q";
    obj(ci,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
    off[ii]=len;addS(ii+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+c.width+" /Height "+c.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");add(jpg);addS("\nendstream\nendobj\n");
  });

function composePage(c0,fmt,fit){
  var c=outCanvas(c0),land=c.width>c.height;
  if(fmt==="O")return {c:c,pw:land?841.89:595.28};
  var A4=fmt==="A4",W,H,pw;
  if(A4){W=land?1754:1240;H=land?1240:1754;pw=land?841.89:595.28;}
  else{W=land?2480:1754;H=land?1754:2480;pw=land?1190.55:841.89;}
  var pg=mk(W,H),x=pg.getContext("2d"),px=c.getContext("2d").getImageData(3,3,1,1).data;
  x.fillStyle="rgb("+px[0]+","+px[1]+","+px[2]+")";x.fillRect(0,0,W,H);
  var mmw=(A4?(land?297:210):(land?420:297)),mp=(SET.marge||0)*W/mmw,AW=W-2*mp,AH=H-2*mp;
  var r=fit==="cover"?Math.max(AW/c.width,AH/c.height):Math.min(AW/c.width,AH/c.height),w=c.width*r,h=c.height*r;
  x.imageSmoothingQuality="high";if(fit==="cover"&&mp>0){x.save();x.beginPath();x.rect(mp,mp,AW,AH);x.clip();}x.drawImage(c,(W-w)/2,(H-h)/2,w,h);if(fit==="cover"&&mp>0)x.restore();
  return {c:pg,pw:pw};
}
function clientPdf(){

}
function sendPdf(share){

function exportOne(p,fmt){

function videoGo(){
  if(VID.busy)return;VID.stop=false;
  if(typeof MediaRecorder==="undefined"||!HTMLCanvasElement.prototype.captureStream){toast("Ce navigateur ne sait pas enregistrer de vidéo.");return;}
  var mime=vidMime();if(!mime){toast("Aucun format vidéo disponible sur ce téléphone.");return;}
  var W=SET.vres||720,H=VID.fmt==="v"?Math.round(W*16/9/2)*2:W,scenes=VID.mode==="ad"?buildAdScenes(W,H,adStyle()):(VID.mode==="photos"?buildPhotoScenes(W,H):buildShowScenes(W,H));
  if(!scenes.length||(VID.mode==="ad"&&scenes.length<3)||(VID.mode==="photos"&&!VID.photos.length)){toast(VID.mode==="ad"?"Ajoute des services dans « Ma fiche publicitaire ».":(VID.mode==="photos"?"Ajoute au moins une photo.":"Choisis au moins un visuel."));return;}
  var cv=mk(W,H),x=cv.getContext("2d"),tr=SET.vtr||0.55,starts=[],total=0;scenes.forEach(function(s){starts.push(total);total+=s.dur;});
  function frame(T){
    var i=scenes.length-1;for(var k=0;k<scenes.length;k++){if(T<starts[k]+scenes[k].dur){i=k;break;}}
    var loc=T-starts[i];scenes[i].draw(x,Math.min(loc,scenes[i].dur));
    if(i+1<scenes.length&&loc>scenes[i].dur-tr){
      var p=(loc-(scenes[i].dur-tr))/tr;p=p*p*(3-2*p);
      x.save();
      if(VID.mode==="show"&&VID.fx==="slide"){x.translate((1-p)*W,0);}else{x.globalAlpha=p;}
      scenes[i+1].draw(x,0);x.restore();}
  }
  frame(0);
  var stream=cv.captureStream(SET.vfps||30),chunks=[],rec,actx=null,asrc=null,again=null,bps=vidBitrate(total,W),vol=(SET.vvol==null?90:SET.vvol)/100;
  var go=function(buf){
    if(buf){try{actx=new (window.AudioContext||window.webkitAudioContext)();var dest=actx.createMediaStreamDestination();asrc=actx.createBufferSource();asrc.buffer=buf;asrc.loop=true;again=actx.createGain();again.gain.value=vol;asrc.connect(again);again.connect(dest);dest.stream.getAudioTracks().forEach(function(tk){stream.addTrack(tk);});}catch(e){actx=null;}}
    start();
  };
  function start(){
    try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.round(bps),audioBitsPerSecond:128000});}catch(e){try{rec=new MediaRecorder(stream);}catch(e2){toast("Enregistrement impossible");return;}}
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    var pr=document.getElementById("v_prog"),bar=document.getElementById("v_bar"),btn=document.getElementById("v_go");
    pr.style.display="block";btn.disabled=true;VID.busy=true;document.getElementById("v_out").innerHTML="";
    rec.onstop=function(){
      VID.busy=false;btn.disabled=false;pr.style.display="none";try{if(asrc)asrc.stop();if(actx)actx.close();}catch(e){}try{if(VID.wl){VID.wl.release();VID.wl=null;}}catch(e){}
      if(VID.stop)return;
      var type=(rec.mimeType||mime).split(";")[0];var blob=new Blob(chunks,{type:type});
      if(!blob.size){toast("La vidéo est vide, réessaie.");return;}
      if(VID.url)URL.revokeObjectURL(VID.url);VID.url=URL.createObjectURL(blob);VID.blob=blob;VID.mime=type;
      var ext=type.indexOf("mp4")>=0?"mp4":"webm",o=document.getElementById("v_out");if(!o)return;
      o.innerHTML='<h2>Ta vidéo ('+Math.round(total)+' s · '+Math.round(blob.size/1e5)/10+' Mo)</h2><video controls playsinline style="width:100%;max-height:70vh;border-radius:10px;background:#000" src="'+VID.url+'"></video>'
       +'<button class="btn full" id="v_dl">⬇ Télécharger la vidéo (.'+ext+')</button>'+(navigator.share?'<button class="btn sec full" id="v_sh">📤 Partager…</button>':'');
      document.getElementById("v_dl").onclick=function(){dl(VID.blob,"video-"+(BR.nom?BR.nom.replace(/[^a-z0-9]+/gi,"_")+"-":"")+"yiridesign."+ext);};
      var sh=document.getElementById("v_sh");if(sh)sh.onclick=function(){var f=new File([VID.blob],"video."+ext,{type:VID.mime});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(function(){});else toast("Partage direct indisponible : télécharge la vidéo.");};
      o.scrollIntoView&&o.scrollIntoView({behavior:"smooth"});
    };
    try{if(SET.vwake&&navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){VID.wl=l;}).catch(function(){});}catch(e){}
    rec.start(500);if(asrc)try{asrc.start();again.gain.setValueAtTime(vol,actx.currentTime);again.gain.setValueAtTime(vol,actx.currentTime+Math.max(0,total-1.5));again.gain.linearRampToValueAtTime(0,actx.currentTime+total);}catch(e){}
    var t0=performance.now();
    (function loop(){
      if(VID.stop){try{rec.stop();}catch(e){}return;}
      var T=(performance.now()-t0)/1000;
      if(T>=total){frame(total-0.001);setTimeout(function(){try{rec.stop();}catch(e){}},250);return;}
      frame(T);if(bar)bar.style.width=Math.round(T/total*100)+"%";requestAnimationFrame(loop);
    })();
  }
  if(VID.music){var ac0=new (window.AudioContext||window.webkitAudioContext)();ac0.decodeAudioData(VID.music.slice(0),function(buf){ac0.close();go(buf);},function(){try{ac0.close();}catch(e){}toast("Musique illisible : vidéo créée sans musique.");go(null);});}
  else go(null);
}

  document.getElementById("a_upd").onclick=function(){toast("Mise à jour en cours…");var jobs=[];try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));}catch(e){}Promise.all(jobs).then(function(){setTimeout(function(){location.reload();},400);}).catch(function(){location.reload();});};
  var tot=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);tot+=(k.length+(localStorage.getItem(k)||"").length)*2;}}catch(e){}

  var e=document.getElementById("a_info");if(e)e.innerHTML=inf;
}
function bindData(){
  document.getElementById("s_exp").onclick=function(){var o={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf("ac_")===0)o[k]=localStorage.getItem(k);}}catch(e){}
    dl(new Blob([JSON.stringify({app:"YiriDesign",v:VER,date:new Date().toISOString(),data:o})],{type:"application/json"}),"yiridesign-sauvegarde-"+new Date().toISOString().slice(0,10)+".json");toast("Sauvegarde téléchargée");};
  document.getElementById("s_imp").onclick=function(){document.getElementById("s_file").click();};
  document.getElementById("s_file").onchange=function(){var f=this.files&&this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){
    try{var j=JSON.parse(fr.result);if(!j||j.app!=="YiriDesign"||!j.data)throw 0;if(!confirm("Remplacer les données actuelles par cette sauvegarde ?"))return;
      Object.keys(j.data).forEach(function(k){if(k.indexOf("ac_")===0)localStorage.setItem(k,j.data[k]);});location.reload();}catch(e){toast("Fichier de sauvegarde non valide");}};fr.readAsText(f);};
  document.getElementById("s_clr").onclick=function(){if(!confirm("Effacer tous les brouillons ? Tes fiches et réglages restent."))return;try{Object.keys(localStorage).filter(function(k){return k.indexOf("ac_d_")===0;}).forEach(function(k){localStorage.removeItem(k);});}catch(e){}toast("Brouillons effacés");};
  document.getElementById("s_rst").onclick=function(){if(!confirm("Tout effacer (fiches, logos, brouillons, réglages) ? Cette action est définitive."))return;if(!confirm("Dernière confirmation : tout supprimer ?"))return;try{Object.keys(localStorage).filter(function(k){return k.indexOf("ac_")===0;}).forEach(function(k){localStorage.removeItem(k);});}catch(e){}location.reload();};
}

     +'<div class="row" style="margin-top:16px"><button class="btn" id="phi">📷 Importer une photo</button></div><input type="file" id="phf" accept="image/*" style="display:none">'
     +(BR.photo?'<div class="row" style="margin-top:12px"><button class="btn" id="phed" style="background:#0f766e">✂ Recadrer / effacer une tache</button></div><div class="row" style="margin-top:12px"><button class="btn sec" id="phai2">✨ Détourer avec l\'IA (internet)</button></div>'+(BR.photoOrig||BR.photoRaw?'<div class="row" style="margin-top:8px"><button class="btn sec" id="phor">↩ Revenir à la photo d\'origine</button></div>':'')+'<div class="hint">La retouche IA retire le fond de la photo. Elle a besoin d\'internet, et la première fois elle télécharge un modèle (assez lourd) : fais-la en Wi-Fi si possible.</div>':'');
  }else if(k==="sty"){
    h+='<label style="margin-top:4px">Couleurs habituelles</label><div class="sw" id="bp">'+PAL.map(function(c,i){return '<button data-i="'+i+'"'+(BR.pal===i?' class="on"':'')+'><i style="background:linear-gradient(135deg,'+c.ac+' 50%,'+c.bg+' 50%)"></i></button>';}).join("")+'</div>'
     +'<label>Police habituelle</label><div class="seg" id="bf">'+FONTS.map(function(f,i){return '<button data-i="'+i+'"'+(BR.font===i?' class="on"':'')+'>'+f.n+'</button>';}).join("")+'</div>';
  }else{
    h+='<div class="thumbs" id="pack"></div>';
  }
  app.innerHTML=h+'</div>';

  Array.prototype.forEach.call(app.querySelectorAll("[data-b]"),function(el){el.addEventListener("input",function(){BR[el.getAttribute("data-b")]=el.value;saveBrands();});});
  function sg(id,key){var e=document.getElementById(id);if(!e)return;Array.prototype.forEach.call(e.querySelectorAll("button"),function(b){b.onclick=function(){BR[key]=parseInt(b.getAttribute("data-i"));saveBrands();Array.prototype.forEach.call(e.querySelectorAll("button"),function(o){o.classList.remove("on");});b.classList.add("on");};});}
  sg("bp","pal");sg("bf","font");
  var lx=document.getElementById("lgx");if(lx)lx.onclick=function(){BR.logo="";saveBrands();again();};
  var li=document.getElementById("lgi");if(li){li.onclick=function(){document.getElementById("lgf").click();};
    document.getElementById("lgf").onchange=function(){var f=this.files&&this.files[0];if(f)readImg(f,600,"image/png",function(u){BR.logo=u;saveBrands();again();toast("Logo enregistré");});};}
  var pi=document.getElementById("phi");if(pi){pi.onclick=function(){document.getElementById("phf").click();};
    document.getElementById("phf").onchange=function(){var f=this.files&&this.files[0];if(f)readImg(f,800,"image/jpeg",function(u){var im=new Image();im.onload=function(){smartPhoto(im,function(c){BR.photoRaw=u;BR.photoOrig="";BR.photo=c.toDataURL("image/jpeg",0.9);saveBrands();again();toast("Photo enregistrée et nettoyée");});};im.src=u;});};}
  var px=document.getElementById("phx2");if(px)px.onclick=function(){BR.photo="";BR.photoOrig="";saveBrands();again();};
  var pa=document.getElementById("phai2");if(pa)pa.onclick=function(){aiCutout(BRPHOTO,function(r){var m=Math.min(1,700/Math.max(r.width,r.height)),c=mk(Math.round(r.width*m),Math.round(r.height*m));c.getContext("2d").drawImage(r,0,0,c.width,c.height);if(!BR.photoOrig)BR.photoOrig=BR.photo;BR.photo=c.toDataURL("image/png");saveBrands();again();});};
  var pe=document.getElementById("phed");if(pe)pe.onclick=photoEditor;
  var po=document.getElementById("phor");if(po)po.onclick=function(){BR.photo=BR.photoOrig||BR.photoRaw;BR.photoOrig="";BR.photoRaw="";saveBrands();again();toast("Photo d'origine rétablie");};
  if(k==="pck")pack();

function pack(){
  var box=document.getElementById("pack");if(!box)return;box.innerHTML="";
  try{
    var save={cur:CUR,st:ST,data:DATA};
    var pi=BR.pal!=null?BR.pal:6,fi=BR.font!=null?BR.font:0;
    function setup(id){CUR=SV[id];ST={pal:pi,font:fi,tpl:0,photo:null,logo:true,sym:0};DATA={};CUR.fields.forEach(function(f){var v=f.d||"";if(f.b){var bv=brandVal(f.b);if(bv)v=bv;}DATA[f.k]=v;});}
    setup("carte");var cr=drawCarte(CUR,DATA);setup("profil");var pr=drawProfil(CUR,DATA);
    setup("affiche");var af=drawPoster(CUR,DATA);
    [cr[0],cr[1],pr[0],af[0]].forEach(function(p){box.appendChild(p.c);});
    CUR=save.cur;ST=save.st;DATA=save.data;
  }catch(e){}
}


/* ---- Éditeur de photo : recadrer / effacer ---- */
var PE=null;
function peDraw(){
  var d=document.getElementById("pe_c");if(!d||!PE)return;var c=PE.cv;d.width=c.width;d.height=c.height;var x=d.getContext("2d");x.drawImage(c,0,0);
  if(PE.mode==="cr"){var w=c.width/PE.z,h=c.height/PE.z,x0=(c.width-w)*PE.ox,y0=(c.height-h)*PE.oy;
    x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,0,c.width,y0);x.fillRect(0,y0+h,c.width,c.height-y0-h);x.fillRect(0,y0,x0,h);x.fillRect(x0+w,y0,c.width-x0-w,h);
    x.strokeStyle="#fff";x.lineWidth=Math.max(2,c.width/180);x.strokeRect(x0,y0,w,h);}
}
function pePush(){PE.hist.push(PE.cv.getContext("2d").getImageData(0,0,PE.cv.width,PE.cv.height));if(PE.hist.length>12)PE.hist.shift();}
function peErase(px,py,r){
  var c=PE.cv,x=c.getContext("2d"),W=c.width,H=c.height,R=r*1.6;
  function sm(sx,sy){sx=Math.max(3,Math.min(W-4,sx));sy=Math.max(3,Math.min(H-4,sy));var d=x.getImageData(Math.round(sx)-2,Math.round(sy)-2,5,5).data,a=0,b=0,g=0,n=0;for(var i=0;i<d.length;i+=4){a+=d[i];g+=d[i+1];b+=d[i+2];n++;}return [a/n,g/n,b/n];}
  var L=sm(px-R,py),Rg=sm(px+R,py),Tp=sm(px,py-R),Bt=sm(px,py+R);
  var x0=Math.max(0,Math.floor(px-r)),y0=Math.max(0,Math.floor(py-r)),x1=Math.min(W,Math.ceil(px+r)),y1=Math.min(H,Math.ceil(py+r));
  var id=x.getImageData(x0,y0,x1-x0,y1-y0),d=id.data,w=x1-x0,k;
  for(var yy=y0;yy<y1;yy++)for(var xx=x0;xx<x1;xx++){var dx=xx-px,dy=yy-py,dist=Math.sqrt(dx*dx+dy*dy);if(dist>r)continue;
    var a=dist<r*0.7?1:(1-(dist/r-0.7)/0.3),u=(dx+r)/(2*r),v=(dy+r)/(2*r),o=((yy-y0)*w+(xx-x0))*4,nz=(Math.random()-0.5)*5;
    for(k=0;k<3;k++){var hc=L[k]*(1-u)+Rg[k]*u,vc=Tp[k]*(1-v)+Bt[k]*v,col=(hc+vc)/2+nz;d[o+k]=d[o+k]*(1-a)+col*a;}}
  x.putImageData(id,x0,y0);
}
function photoEditor(){
  screen("Retoucher la photo",function(){fichePage("pho");});
  var im=new Image();im.onload=function(){
    var m=Math.min(1,720/Math.max(im.width,im.height)),cv=mk(Math.round(im.width*m),Math.round(im.height*m));cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    PE={cv:cv,hist:[],mode:"er",br:6,z:1,ox:0.5,oy:0.5,down:false};
    app.innerHTML='<div class="hint" style="margin-top:0" id="pe_h"></div><div style="background:#e5e7eb;border-radius:12px;padding:6px"><canvas id="pe_c" style="width:100%;display:block;touch-action:none;border-radius:8px"></canvas></div>'
     +'<div class="seg" id="pe_m" style="margin-top:16px"><button data-v="er" class="on">🩹 Effacer une tache</button><button data-v="cr">✂ Recadrer</button></div>'
     +'<div id="pe_er"><label>Taille de la gomme</label>'+seg("pe_b",[[3,"Petite"],[6,"Moyenne"],[10,"Grande"]],6)+'</div>'
     +'<div id="pe_cr" style="display:none"><label>Zoom</label><input type="range" id="pe_z" min="1" max="3" step="0.05" value="1"><label>Position horizontale</label><input type="range" id="pe_x" min="0" max="1" step="0.01" value="0.5"><label>Position verticale</label><input type="range" id="pe_y" min="0" max="1" step="0.01" value="0.5"><div class="row" style="margin-top:14px"><button class="btn" id="pe_ap">Appliquer le recadrage</button></div></div>'
     +'<div class="row" style="margin-top:22px"><button class="btn sec" id="pe_un">↶ Annuler</button><button class="btn" id="pe_sv">✔ Enregistrer</button></div>';
    var hint=function(){document.getElementById("pe_h").textContent=PE.mode==="er"?"Touche (ou glisse le doigt sur) une tache, une icône ou un défaut pour l'effacer.":"Règle le cadre avec le zoom et les positions, puis touche « Appliquer ».";};
    function setMode(v){PE.mode=v;document.getElementById("pe_er").style.display=v==="er"?"block":"none";document.getElementById("pe_cr").style.display=v==="cr"?"block":"none";Array.prototype.forEach.call(document.querySelectorAll("#pe_m button"),function(b){b.classList.toggle("on",b.getAttribute("data-v")===v);});hint();peDraw();}
    Array.prototype.forEach.call(document.querySelectorAll("#pe_m button"),function(b){b.onclick=function(){setMode(b.getAttribute("data-v"));};});
    Array.prototype.forEach.call(document.querySelectorAll("#pe_b button"),function(b){b.onclick=function(){PE.br=parseInt(b.getAttribute("data-v"));Array.prototype.forEach.call(document.querySelectorAll("#pe_b button"),function(o){o.classList.remove("on");});b.classList.add("on");};});
    var cvE=document.getElementById("pe_c");
    function pos(e){var r=cvE.getBoundingClientRect();return [(e.clientX-r.left)*cvE.width/r.width,(e.clientY-r.top)*cvE.height/r.height];}
    function er(e){if(PE.mode!=="er")return;var p=pos(e);peErase(p[0],p[1],PE.cv.width*PE.br/100);peDraw();}
    cvE.addEventListener("pointerdown",function(e){if(PE.mode!=="er")return;e.preventDefault();pePush();PE.down=true;try{cvE.setPointerCapture(e.pointerId);}catch(x){}er(e);});
    cvE.addEventListener("pointermove",function(e){if(PE.down)er(e);});
    cvE.addEventListener("pointerup",function(){PE.down=false;});cvE.addEventListener("pointercancel",function(){PE.down=false;});
    ["pe_z","pe_x","pe_y"].forEach(function(id){document.getElementById(id).oninput=function(){PE.z=parseFloat(document.getElementById("pe_z").value);PE.ox=parseFloat(document.getElementById("pe_x").value);PE.oy=parseFloat(document.getElementById("pe_y").value);peDraw();};});
    document.getElementById("pe_ap").onclick=function(){var c=PE.cv,w=Math.round(c.width/PE.z),h=Math.round(c.height/PE.z),x0=Math.round((c.width-w)*PE.ox),y0=Math.round((c.height-h)*PE.oy);if(PE.z<=1.001){toast("Augmente le zoom pour recadrer");return;}pePush();var o=mk(w,h);o.getContext("2d").drawImage(c,x0,y0,w,h,0,0,w,h);PE.cv=o;PE.z=1;PE.ox=0.5;PE.oy=0.5;document.getElementById("pe_z").value=1;document.getElementById("pe_x").value=0.5;document.getElementById("pe_y").value=0.5;peDraw();toast("Recadrage appliqué");};
    document.getElementById("pe_un").onclick=function(){var h=PE.hist.pop();if(!h){toast("Rien à annuler");return;}var c=mk(h.width,h.height);c.getContext("2d").putImageData(h,0,0);PE.cv=c;peDraw();};
    document.getElementById("pe_sv").onclick=function(){if(!BR.photoRaw)BR.photoRaw=BR.photo;BR.photo=PE.cv.toDataURL("image/jpeg",0.9);saveBrands();loadLogoImg(function(){toast("Photo enregistrée");fichePage("pho");});};
    hint();peDraw();
  };
  im.src=BR.photo;
}

/* ============ Verrouillage ============ */
function hashPin(v,cb){
  try{if(window.crypto&&crypto.subtle){crypto.subtle.digest("SHA-256",new TextEncoder().encode("yiri:"+v)).then(function(b){cb(Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join(""));}).catch(function(){cb("p"+btoa(v));});return;}}catch(e){}
  cb("p"+btoa(v));
}
function lockScreen(){
  if(!SET.pin)return;
  var ov=document.createElement("div");ov.id="lock";ov.style.cssText="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center";
  ov.innerHTML='<div style="font-size:44px">🔒</div><div style="font-size:20px;font-weight:700">YiriDesign</div><div style="color:var(--mut)">Saisis ton code</div><input type="password" inputmode="numeric" maxlength="4" id="lk" style="max-width:180px;text-align:center;font-size:28px;letter-spacing:10px"><div id="lke" style="color:#b91c1c;min-height:20px"></div>';
  document.body.appendChild(ov);var lk=document.getElementById("lk");setTimeout(function(){lk.focus();},50);
  lk.oninput=function(){if(lk.value.length===4){hashPin(lk.value,function(hh){if(hh===SET.pin){ov.remove();}else{document.getElementById("lke").textContent="Code incorrect";lk.value="";}});}};
}
