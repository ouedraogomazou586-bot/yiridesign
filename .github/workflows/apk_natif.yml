# Fabrique l'application YiriDesign en APK « natif » (comme Mortier) : tout est dans l'APK, rien ne dépend de Chrome.
# À placer dans le dépôt de l'application sous le nom .github/workflows/apk_natif.yml
# Lancement : onglet Actions -> « Fabriquer YiriDesign (APK natif) » -> Run workflow.
name: Fabriquer YiriDesign (APK natif)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Vérifier les fichiers de l'application
        run: |
          test -f index.html || { echo "ERREUR : index.html est introuvable à la racine du dépôt."; exit 1; }
          test -d assets/fonds || { echo "ERREUR : le dossier assets est absent. Lance d'abord « Installer la bibliothèque d'images »."; exit 1; }
          ls -la
          du -sh assets

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Garder la même clé de signature d'une fabrication à l'autre
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yiridesign-debug-keystore-v1

      - name: Créer le projet Android
        run: |
          mkdir -p /tmp/natif/www
          cp index.html /tmp/natif/www/
          cp -r assets /tmp/natif/www/assets
          for f in manifest.webmanifest ic192.png ic512.png; do [ -f "$f" ] && cp "$f" /tmp/natif/www/ || true; done
          cd /tmp/natif
          cat > package.json <<'JSON'
          {"name":"yiridesign","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/app":"^6.0.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0","@capacitor/filesystem":"^6.0.0","@capacitor/share":"^6.0.0"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"bf.yiridesign.app","appName":"YiriDesign","webDir":"www","server":{"androidScheme":"https"},"backgroundColor":"#0F766E"}
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          echo "Fichiers embarqués dans l'APK :"
          find android/app/src/main/assets/public -type f | wc -l
          du -sh android/app/src/main/assets/public

      - name: Ajouter le scanner de documents Google (ML Kit)
        run: |
          cd /tmp/natif/android
          cat > /tmp/scanner.py <<'PY'
          import os, re, shutil
          pkg = "bf/yiridesign/app"
          d = "app/src/main/java/" + pkg
          os.makedirs(d, exist_ok=True)
          main = d + "/MainActivity.java"
          assert os.path.exists(main), "MainActivity.java introuvable : " + main
          shutil.copy(main, "/tmp/MainActivity.java.bak")
          shutil.copy("app/build.gradle", "/tmp/build.gradle.bak")
          open(d + "/DocScannerPlugin.java", "w", encoding="utf-8").write("""package bf.yiridesign.app;

          import android.app.Activity;
          import android.content.IntentSender;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.IntentSenderRequest;
          import androidx.activity.result.contract.ActivityResultContracts;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.mlkit.vision.documentscanner.GmsDocumentScannerOptions;
          import com.google.mlkit.vision.documentscanner.GmsDocumentScanning;
          import com.google.mlkit.vision.documentscanner.GmsDocumentScanningResult;

          @CapacitorPlugin(name = "DocumentScanner")
          public class DocScannerPlugin extends Plugin {
            private ActivityResultLauncher<IntentSenderRequest> launcher;
            private PluginCall pending;

            @Override
            public void load() {
              launcher = getActivity().registerForActivityResult(new ActivityResultContracts.StartIntentSenderForResult(), result -> {
                PluginCall call = pending;
                pending = null;
                if (call == null) return;
                if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                  call.reject("canceled");
                  return;
                }
                try {
                  GmsDocumentScanningResult r = GmsDocumentScanningResult.fromActivityResultIntent(result.getData());
                  JSArray arr = new JSArray();
                  if (r != null && r.getPages() != null) {
                    for (GmsDocumentScanningResult.Page p : r.getPages()) arr.put(p.getImageUri().toString());
                  }
                  JSObject o = new JSObject();
                  o.put("scannedImages", arr);
                  call.resolve(o);
                } catch (Exception e) {
                  call.reject(String.valueOf(e.getMessage()));
                }
              });
            }

            @PluginMethod
            public void isGoogleDocumentScannerModuleAvailable(PluginCall call) {
              JSObject o = new JSObject();
              o.put("available", true);
              call.resolve(o);
            }

            @PluginMethod
            public void installGoogleDocumentScannerModule(PluginCall call) {
              call.resolve();
            }

            @PluginMethod
            public void scanDocument(PluginCall call) {
              if (pending != null) {
                call.reject("busy");
                return;
              }
              Integer limit = call.getInt("pageLimit", 20);
              Boolean gal = call.getBoolean("galleryImportAllowed", true);
              GmsDocumentScannerOptions options = new GmsDocumentScannerOptions.Builder()
                .setGalleryImportAllowed(gal == null ? true : gal)
                .setPageLimit(limit == null ? 20 : limit)
                .setResultFormats(GmsDocumentScannerOptions.RESULT_FORMAT_JPEG)
                .setScannerMode(GmsDocumentScannerOptions.SCANNER_MODE_FULL)
                .build();
              pending = call;
              GmsDocumentScanning.getClient(options)
                .getStartScanIntent(getActivity())
                .addOnSuccessListener(intentSender -> {
                  try {
                    launcher.launch(new IntentSenderRequest.Builder(intentSender).build());
                  } catch (Exception e) {
                    pending = null;
                    call.reject(String.valueOf(e.getMessage()));
                  }
                })
                .addOnFailureListener(e -> {
                  pending = null;
                  call.reject(String.valueOf(e.getMessage()));
                });
            }
          }
          """)
          open(main, "w", encoding="utf-8").write("""package bf.yiridesign.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(DocScannerPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          """)
          g = open("app/build.gradle", encoding="utf-8").read()
          assert "\ndependencies {" in g, "bloc dependencies introuvable"
          g = g.replace("\ndependencies {", "\ndependencies {\n    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'", 1)
          open("app/build.gradle", "w", encoding="utf-8").write(g)
          print("scanner Google ajouté")
          PY
          python3 /tmp/scanner.py
          echo scanner > /tmp/variante

      - name: Régler Android (icône, orientation, écran de démarrage, version)
        run: |
          cd /tmp/natif
          cat > /tmp/regler.py <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          assert "<activity" in s, "manifeste inattendu : balise activity introuvable"
          if "screenOrientation" not in s:
              s = s.replace("<activity", '<activity android:screenOrientation="portrait"', 1)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY
          python3 /tmp/regler.py
          pip install --quiet pillow
          cat > /tmp/icones.py <<'PY'
          import os, shutil
          from PIL import Image
          src = None
          for n in ("ic512.png", "ic192.png"):
              if os.path.exists("www/" + n):
                  src = Image.open("www/" + n).convert("RGBA"); break
          if src is None:
              print("pas d'icône : icône par défaut"); raise SystemExit
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          for d, px in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              folder = res + "/mipmap-" + d
              os.makedirs(folder, exist_ok=True)
              im = src.resize((px, px), Image.LANCZOS)
              for nom in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  im.save(folder + "/" + nom)
          PY
          python3 /tmp/icones.py
          # écran de démarrage : fond vert YiriDesign à la place du logo Capacitor
          find android/app/src/main/res -name 'splash*.png' -delete || true
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><color android:color="#0F766E"/></item>
              <item android:gravity="center" android:width="120dp" android:height="120dp"><bitmap android:src="@mipmap/ic_launcher" android:gravity="center"/></item>
          </layer-list>
          XML
          # numéro de version = numéro de fabrication (permet les mises à jour)
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName\|applicationId" android/app/build.gradle

      - name: Compiler l'APK (avec le scanner Google)
        id: avec
        continue-on-error: true
        working-directory: /tmp/natif/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Si le scanner Google bloque la fabrication, on le retire et on recompile
        if: steps.avec.outcome == 'failure'
        working-directory: /tmp/natif/android
        run: |
          echo "ATTENTION : la fabrication avec le scanner Google a échoué. Fabrication sans lui (l'ancien scanner sera utilisé)."
          cp /tmp/MainActivity.java.bak app/src/main/java/bf/yiridesign/app/MainActivity.java
          cp /tmp/build.gradle.bak app/build.gradle
          rm -f app/src/main/java/bf/yiridesign/app/DocScannerPlugin.java
          echo sans > /tmp/variante
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer le fichier
        run: |
          cp /tmp/natif/android/app/build/outputs/apk/debug/app-debug.apk "YiriDesign-${{ github.run_number }}.apk"
          ls -la YiriDesign-*.apk
          echo "Variante : $(cat /tmp/variante)"

      - name: Publier l'APK (page « Releases » du dépôt)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: YiriDesign ${{ github.run_number }}
          body: Application Android YiriDesign, fabrication numéro ${{ github.run_number }}. Télécharge le fichier .apk ci-dessous puis installe-le.
          files: YiriDesign-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YiriDesign-apk
          path: YiriDesign-${{ github.run_number }}.apk
