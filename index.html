<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>YiriDesign</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ic192.png">
<link rel="apple-touch-icon" href="ic192.png">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#0f766e;--ac2:#115e59;--bd:#e3e1db}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;font-weight:700;flex:1}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px}
main{padding:16px;max-width:760px;margin:0 auto;padding-bottom:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;min-height:96px}
.card .i{font-size:28px}.card b{font-size:15px}.card small{color:var(--mut);font-size:12.5px;line-height:1.3}
.card.off{opacity:.55}
h2{font-size:15px;margin:22px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pv{display:flex;flex-direction:column;gap:12px;align-items:center;margin-bottom:12px}
.pv canvas,.pv img{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.pv iframe{width:100%;height:420px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.pv .lab{font-size:12px;color:var(--mut);align-self:flex-start}
.tabs{display:flex;gap:6px;margin:6px 0 14px;position:sticky;top:52px;z-index:4;background:var(--bg);padding:6px 0}
.tabs button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font:inherit;font-size:15px;color:var(--tx)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}
textarea{min-height:92px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px}
.btn.sec{background:#fff;color:var(--ac);border:1px solid var(--ac)}
.btn.full{width:100%;margin-top:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;padding:0;overflow:hidden;position:relative}
.sw button.on{border-color:var(--tx)}
.sw button i{position:absolute;inset:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:#fff;font:inherit;font-size:15px;color:var(--tx)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.note{font-size:13px;color:var(--mut);line-height:1.45;background:#fff;border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;margin-top:12px}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:15px;color:var(--tx)}
.chk input{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.err{background:#fee2e2;color:#7f1d1d;padding:10px 12px;font-size:13px;display:none}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs canvas,.thumbs img{width:100%;height:auto;border:1px solid var(--bd);border-radius:6px;background:#fff}
</style>
</head>

/* ============ Stockage ============ */
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var BR=lsGet("ac_brand",{nom:"",slogan:"",tel:"",mail:"",adr:"",web:"",pal:null,font:null,logo:""});
var LOGOIMG=null;
function loadLogoImg(cb){if(!BR.logo){LOGOIMG=null;cb&&cb();return;}var im=new Image();im.onload=function(){LOGOIMG=im;cb&&cb();};im.onerror=function(){LOGOIMG=null;cb&&cb();};im.src=BR.logo;}
function brandVal(b){
  if(b==="nom")return BR.nom;if(b==="tel")return BR.tel;if(b==="mail")return BR.mail;if(b==="adr")return BR.adr;
  if(b==="web")return BR.web;if(b==="slogan")return BR.slogan;
  if(b==="wa")return (BR.tel||"").replace(/[^0-9]/g,"");
  if(b==="coord")return [BR.tel,BR.mail,BR.adr].filter(Boolean).join("\n");
  return "";
}

/* ============ État ============ */
var CUR=null, DATA={}, ST={pal:0,font:0,tpl:0,photo:null,logo:true,sym:0}, TAB="c", PRE=[];
var app=document.getElementById("app"), ttl=document.getElementById("ttl"), backB=document.getElementById("back");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}

/* ============ Outils de dessin ============ */
function mk(w,h){var c=document.createElement("canvas");c.width=w;c.height=h;return c;}
function wrap(x,text,font,maxW){
  x.font=font;var out=[];String(text).split("\n").forEach(function(par){
    var words=par.split(/\s+/).filter(Boolean),line="";
    if(!words.length){out.push("");return;}
    words.forEach(function(w){var t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;});
    out.push(line);});
  return out;}
function fitSize(x,text,fam,wt,max,maxW,min){var s=max;while(s>min){x.font=wt+" "+s+"px "+fam;if(x.measureText(text).width<=maxW)break;s-=2;}return s;}
function cover(x,im,dx,dy,dw,dh){var r=Math.max(dw/im.width,dh/im.height),w=im.width*r,h=im.height*r;x.drawImage(im,dx+(dw-w)/2,dy+(dh-h)/2,w,h);}
function circlePhoto(x,im,cx,cy,r,ring,pbg){
  x.save();x.beginPath();x.arc(cx,cy,r+r*.06,0,7);x.fillStyle=ring;x.fill();
  x.beginPath();x.arc(cx,cy,r,0,7);x.clip();x.fillStyle=pbg;x.fillRect(cx-r,cy-r,2*r,2*r);
  if(im)cover(x,im,cx-r,cy-r,2*r,2*r);x.restore();}
function initials(s){return String(s||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||"";}).join("").toUpperCase();}
function numFmt(n){return (Math.round(n*100)/100).toLocaleString("fr-FR").replace(/[  ]/g," ");}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function stampLogo(x,W,H,pos){
  if(!ST.logo||!LOGOIMG)return;var s=W*0.13,m=W*0.04,a=pos==="br"?W-m-s:m,b=pos==="br"?H-m-s:m;
  x.save();x.fillStyle="rgba(255,255,255,.92)";x.beginPath();x.arc(a+s/2,b+s/2,s/2+6,0,7);x.fill();
  var r=Math.min(s/LOGOIMG.width,s/LOGOIMG.height),w=LOGOIMG.width*r,h=LOGOIMG.height*r;x.drawImage(LOGOIMG,a+(s-w)/2,b+(s-h)/2,w,h);x.restore();}

/* ---- rendu générique des affiches (3 modèles) ---- */
function drawPoster(cfg,d){
  var c=mk(cfg.w,cfg.h),x=c.getContext("2d"),W=c.width,H=c.height,P=PAL[ST.pal],F=FONTS[ST.font],m=W*0.09,tpl=ST.tpl;
  var det=(d.details||"").split("\n").map(function(s){return s.trim();}).filter(Boolean);
  var when=[d.date,d.lieu].filter(Boolean);
  var dark=tpl===2, txtc=dark?"#ffffff":P.fg;
  function bgPaint(){
    x.fillStyle=P.bg;x.fillRect(0,0,W,H);
    if(tpl===2){
      if(ST.photo){cover(x,ST.photo,0,0,W,H);var g=x.createLinearGradient(0,H*.25,0,H);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.85)");x.fillStyle=g;x.fillRect(0,0,W,H);}
      else{var g2=x.createLinearGradient(0,0,W,H);g2.addColorStop(0,P.ac);g2.addColorStop(1,P.ac2===P.ac?P.fg:P.ac2);x.fillStyle=g2;x.fillRect(0,0,W,H);
        x.fillStyle="rgba(0,0,0,.28)";x.fillRect(0,0,W,H);}
    }
  }
  function run(s){
    bgPaint();var y;var al=tpl===0?"center":"left";var hasPh=!!ST.photo&&tpl!==2;
    function T(str,size,fam,wt,col,gap,fixedY,al2){
      if(!str)return;var a=al2||al,px=Math.round(size*s);var f=wt+" "+px+"px "+fam;var ls=wrap(x,str,f,W-2*m);
      x.font=f;x.fillStyle=col;x.textAlign=a;x.textBaseline="top";var xx=a==="center"?W/2:(a==="left"?m:W-m);
      ls.forEach(function(l,i){x.fillText(l,xx,y+i*px*1.18);});y+=ls.length*px*1.18+(gap||0)*s;}
    if(tpl===0){
      x.strokeStyle=P.ac;x.lineWidth=W*0.009;x.strokeRect(W*.04,W*.04,W-W*.08,H-W*.08);
      x.lineWidth=W*0.003;x.strokeRect(W*.06,W*.06,W-W*.12,H-W*.12);
      y=H*0.10;
      T(d.sous,W*0.042,F.b,"italic",P.fg,W*0.02);
      T(d.titre,fitSize(x,(d.titre||"").split("\n")[0],F.h,F.hw,W*0.15,(W-2*m)/s,28),F.h,F.hw,P.ac,W*0.03);
      x.fillStyle=P.ac;x.fillRect(W/2-W*0.1,y,W*0.2,W*0.006);y+=W*0.04*s;
      if(hasPh){var r=W*0.2*s;circlePhoto(x,ST.photo,W/2,y+r,r,P.ac,P.bg);y+=2*r+W*0.04*s;}
      when.forEach(function(t){T(t,W*0.05,F.h,"bold",P.fg,W*0.008);});
      y+=W*0.02*s;
      det.forEach(function(t){T(t,W*0.042,F.b,"normal",P.fg,W*0.008);});
      var yy=y;
      if(d.contact){var py=H-W*0.16;x.fillStyle=P.ac;x.fillRect(W*.06,py,W-W*.12,W*0.1);x.font="bold "+Math.round(W*.045)+"px "+F.b;x.fillStyle=P.bg;x.textAlign="center";x.textBaseline="middle";x.fillText(d.contact,W/2,py+W*.05);yy=Math.max(yy,0);}
      stampLogo(x,W,H,"br");
      return yy-(d.contact?H-W*0.18:H-m);
    }
    if(tpl===1){
      var bh=H*(hasPh?0.40:0.34);x.fillStyle=P.ac;x.fillRect(0,0,W,bh);

  }else if(disp==="Symbole à gauche"){

/* ---- profil + bannière ---- */
function drawProfil(cfg,d){
  var P=PAL[ST.pal],F=FONTS[ST.font],tpl=ST.tpl;
  var b=mk(1500,500),x=b.getContext("2d");
  var g=x.createLinearGradient(0,0,1500,500);
  if(tpl===1){x.fillStyle=P.bg;x.fillRect(0,0,1500,500);x.fillStyle=P.ac;x.fillRect(0,0,40,500);}
  else if(tpl===2){x.fillStyle=P.fg;x.fillRect(0,0,1500,500);x.fillStyle=P.ac;x.beginPath();x.moveTo(1500,0);x.lineTo(900,0);x.lineTo(1200,500);x.lineTo(1500,500);x.fill();}
  else{g.addColorStop(0,P.ac);g.addColorStop(1,P.ac2===P.ac?P.fg:P.ac2);x.fillStyle=g;x.fillRect(0,0,1500,500);}
  var onLight=tpl===1,col=onLight?P.fg:"#fff";
  x.textBaseline="middle";x.textAlign="left";
  var nm=d.nom||"";var sz=fitSize(x,nm,F.h,F.hw,100,900,36);x.font=F.hw+" "+sz+"px "+F.h;x.fillStyle=onLight?P.ac:col;x.fillText(nm,110,190);
  x.font="italic 44px "+F.b;x.fillStyle=col;x.fillText(d.slogan||"",110,270);
  x.font="bold 36px "+F.b;x.fillStyle=onLight?P.ac:col;x.fillText(d.contact||"",110,370);
  if(LOGOIMG&&ST.logo){x.fillStyle="#fff";x.beginPath();x.arc(1280,250,140,0,7);x.fill();var r=Math.min(230/LOGOIMG.width,230/LOGOIMG.height);x.drawImage(LOGOIMG,1280-LOGOIMG.width*r/2,250-LOGOIMG.height*r/2,LOGOIMG.width*r,LOGOIMG.height*r);}
  var p=mk(800,800),y=p.getContext("2d");y.fillStyle=P.ac;y.fillRect(0,0,800,800);

  return [{c:b,name:"banniere"},{c:p,name:"photo-profil"}];
}

/* ============ Rendu dispatcher ============ */
function renderAll(){
  var cfg=CUR,d=DATA;PRE=[];
  try{
    if(cfg.kind==="poster")PRE=drawPoster(cfg,d);
    else if(cfg.kind==="carte")PRE=drawCarte(cfg,d);
    else if(cfg.kind==="menu")PRE=drawMenu(cfg,d);
    else if(cfg.kind==="badge")PRE=drawBadge(cfg,d);
    else if(cfg.kind==="cert")PRE=drawCert(cfg,d);
    else if(cfg.kind==="facture")PRE=drawFacture(cfg,d);
    else if(cfg.kind==="profil")PRE=drawProfil(cfg,d);
    else if(cfg.kind==="page")PRE=[{html:buildPage(d),name:"page"}];
    else if(cfg.kind==="logo")PRE=[{svg:logoSvg(d,false),name:"logo"}];
  }catch(e){var er=document.getElementById("err");er.style.display="block";er.textContent="Erreur de rendu: "+e.message;}
  paintPreview();
}
function paintPreview(){
  var box=document.getElementById("pv");if(!box)return;box.innerHTML="";
  PRE.forEach(function(p,i){
    if(p.c){var cv=mk(p.c.width,p.c.height);cv.getContext("2d").drawImage(p.c,0,0);box.appendChild(cv);}
    else if(p.svg){var im=new Image();im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(p.svg);box.appendChild(im);}

/* ============ Export ============ */
function dl(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
function canvasBlob(c,type,q,cb){c.toBlob(cb,type,q);}
function b64ToBytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function makePdf(c){
  var jpg=b64ToBytes(c.toDataURL("image/jpeg",0.93).split(",")[1]);
  var pw=595.28,ph=pw*c.height/c.width;if(c.width>c.height){pw=841.89;ph=pw*c.height/c.width;}
  var enc=new TextEncoder(),parts=[],off=[],len=0;
  function add(u){parts.push(u);len+=u.length;}
  function addS(s){add(enc.encode(s));}
  addS("%PDF-1.4\n");
  function obj(n,s){off[n]=len;addS(n+" 0 obj\n"+s+"\nendobj\n");}
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw.toFixed(2)+" "+ph.toFixed(2)+"] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>");
  var cs="q "+pw.toFixed(2)+" 0 0 "+ph.toFixed(2)+" 0 0 cm /Im0 Do Q";
  obj(4,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  off[5]=len;addS("5 0 obj\n<< /Type /XObject /Subtype /Image /Width "+c.width+" /Height "+c.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");add(jpg);addS("\nendstream\nendobj\n");
  var xr=len;addS("xref\n0 6\n0000000000 65535 f \n");
  for(var i=1;i<=5;i++)addS(("0000000000"+off[i]).slice(-10)+" 00000 n \n");
  addS("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  var out=new Uint8Array(len),p=0;parts.forEach(function(u){out.set(u,p);p+=u.length;});
  return new Blob([out],{type:"application/pdf"});
}
function fname(p){return (p.name||"creation").replace(/[^a-z0-9\-_.]+/gi,"_");}
function exportOne(p,fmt){
  if(p.c){
    if(fmt==="pdf")dl(makePdf(p.c),fname(p)+".pdf");
    else canvasBlob(p.c,fmt==="jpg"?"image/jpeg":"image/png",0.93,function(b){dl(b,fname(p)+"."+(fmt==="jpg"?"jpg":"png"));});
  }else if(p.html){dl(new Blob([p.html],{type:"text/html"}),"index.html");}
  else if(p.svg){
    if(fmt==="svg")dl(new Blob([logoSvg(DATA,true)],{type:"image/svg+xml"}),"logo.svg");
    else svgToCanvas(logoSvg(DATA,fmt==="png-fond"?false:true),function(c){
      if(fmt==="pdf")dl(makePdf(whiteBg(c)),"logo.pdf");else canvasBlob(c,"image/png",1,function(b){dl(b,"logo"+(fmt==="png-fond"?"-fond":"")+".png");});});
  }
}
function trimC(c){var x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height).data,w=c.width,h=c.height,a=w,b=h,e=0,f=0;for(var j=0;j<h;j++)for(var i=0;i<w;i++){if(d[(j*w+i)*4+3]>8){if(i<a)a=i;if(i>e)e=i;if(j<b)b=j;if(j>f)f=j;}}if(e<a||f<b)return c;var m=20,o=mk(e-a+1+2*m,f-b+1+2*m);o.getContext('2d').drawImage(c,a,b,e-a+1,f-b+1,m,m,e-a+1,f-b+1);return o;}
function whiteBg(c){var o=mk(c.width,c.height),x=o.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0);return o;}
function shareFirst(){
  var p=PRE[0];if(!p||!p.c){toast("Partage non disponible pour ce service");return;}
  p.c.toBlob(function(b){var f=new File([b],fname(p)+".png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:CUR.nom}).catch(function(){});
    else{dl(b,fname(p)+".png");toast("Partage direct indisponible : image téléchargée");}},"image/png");}

    on("xi",function(){all("png");});on("xj",function(){all("jpg");});on("xd",function(){all("pdf");});on("xsh",shareFirst);on("xh",function(){all("html");});
    on("xs",function(){exportOne(PRE[0],"svg");});on("xp",function(){exportOne(PRE[0],"png");});on("xpf",function(){exportOne(PRE[0],"png-fond");});on("xpd",function(){exportOne(PRE[0],"pdf");});
    on("xb",function(){svgToCanvas(logoSvg(DATA,true),function(c0){var c=trimC(c0),s=mk(500,Math.round(500*c.height/c.width));s.getContext("2d").drawImage(c,0,0,s.width,s.height);BR.logo=s.toDataURL("image/png");if(!BR.nom)BR.nom=DATA.nom||"";lsSet("ac_brand",BR);loadLogoImg(function(){toast("Logo enregistré dans Mon identité");});});});
  }
}

/* ---- Mon identité ---- */
function identity(){
  CUR=null;ttl.textContent="Mon identité";backB.style.display="";document.getElementById("idb").style.display="none";
  var F=[["nom","Nom de l'entreprise / marque"],["slogan","Slogan"],["tel","Téléphone / WhatsApp"],["mail","Email"],["adr","Adresse"],["web","Site / réseau social"]];
  var h='<div class="note" style="margin-top:0">Ces informations remplissent automatiquement vos affiches, cartes, factures, menus, badges et mini-pages.</div>';
  F.forEach(function(f){h+='<label>'+f[1]+'</label><input type="text" data-b="'+f[0]+'" value="'+esc(BR[f[0]])+'">';});
  h+='<label>Couleurs habituelles</label><div class="sw" id="bp">'+PAL.map(function(c,i){return '<button data-i="'+i+'"'+(BR.pal===i?' class="on"':'')+'><i style="background:linear-gradient(135deg,'+c.ac+' 50%,'+c.bg+' 50%)"></i></button>';}).join("")+'</div>';
  h+='<label>Police habituelle</label><div class="seg" id="bf">'+FONTS.map(function(f,i){return '<button data-i="'+i+'"'+(BR.font===i?' class="on"':'')+'>'+f.n+'</button>';}).join("")+'</div>';
  h+='<label>Mon logo</label>'+(BR.logo?'<img src="'+BR.logo+'" style="max-width:220px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px"><div class="row" style="margin-top:8px"><button class="btn sec" id="lgx">Retirer le logo</button></div>':'<div class="hint">Aucun logo. Créez-le dans « Création de logo », puis touchez « Utiliser comme mon logo ».</div>');
  h+='<h2>Aperçu de votre pack</h2><div class="thumbs" id="pack"></div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll("[data-b]"),function(el){el.addEventListener("input",function(){BR[el.getAttribute("data-b")]=el.value;lsSet("ac_brand",BR);clearTimeout(tmr);tmr=setTimeout(pack,200);});});
  function seg(id,key){var e=document.getElementById(id);Array.prototype.forEach.call(e.querySelectorAll("button"),function(b){b.onclick=function(){BR[key]=parseInt(b.getAttribute("data-i"));lsSet("ac_brand",BR);Array.prototype.forEach.call(e.querySelectorAll("button"),function(o){o.classList.remove("on");});b.classList.add("on");pack();};});}
  seg("bp","pal");seg("bf","font");
  var lx=document.getElementById("lgx");if(lx)lx.onclick=function(){BR.logo="";lsSet("ac_brand",BR);loadLogoImg(identity);};
  pack();
}
function pack(){
  var box=document.getElementById("pack");if(!box)return;box.innerHTML="";
  try{
    var save={cur:CUR,st:ST,data:DATA};
    var pi=BR.pal!=null?BR.pal:6,fi=BR.font!=null?BR.font:0;
    function setup(id){CUR=SV[id];ST={pal:pi,font:fi,tpl:0,photo:null,logo:true,sym:0};DATA={};CUR.fields.forEach(function(f){var v=f.d||"";if(f.b){var bv=brandVal(f.b);if(bv)v=bv;}DATA[f.k]=v;});}
    setup("carte");var cr=drawCarte(CUR,DATA);setup("profil");var pr=drawProfil(CUR,DATA);
    setup("affiche");var af=drawPoster(CUR,DATA);
    [cr[0],cr[1],pr[0],af[0]].forEach(function(p){box.appendChild(p.c);});
    CUR=save.cur;ST=save.st;DATA=save.data;
  }catch(e){}
}

/* ============ Démarrage ============ */
backB.onclick=home;
document.getElementById("idb").onclick=identity;
loadLogoImg(home);
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js");}catch(e){}
</script>
